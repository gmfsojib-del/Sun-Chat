<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Chat - Private View</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg-body: #0f171c; --bg-side: #111b21; --txt-main: #e9edef; --border: #374045; --chat-bg: #efe7dd; }
        .light-mode { --bg-body: #f0f2f5; --bg-side: #ffffff; --txt-main: #111b21; --border: #ddd; --chat-bg: #e5ddd5; }
        * { box-sizing: border-box; transition: all 0.3s ease; }
        body { margin: 0; background: var(--bg-body); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; overflow: hidden; color: var(--txt-main); }

        /* Sidebar Styling */
        #sidebar { width: 300px; background: var(--bg-side); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; font-weight: bold; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .room-list { flex: 1; overflow-y: auto; padding: 10px; }
        .room-item { padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 8px; background: #202c33; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; color: #e9edef; }

        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        
        /* Chat Container with Fixed Structure */
        .chat-container { 
            width: 420px; height: 600px; background: var(--chat-bg); 
            display: none; flex-direction: column; border-radius: 15px; 
            overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
        }

        header { background: rgba(0,0,0,0.15); color: white; padding: 15px; display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; }
        .header-right { text-align: right; display: flex; gap: 12px; justify-content: flex-end; font-size: 18px; cursor: pointer; }
        .online-dot { width: 10px; height: 10px; background: #00ff00; border-radius: 50%; display: inline-block; margin-right: 5px; }

        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: transparent; scroll-behavior: smooth; }
        
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; position: relative; }
        .my-msg { align-self: flex-end; } .other-msg { align-self: flex-start; }
        .msg-content { padding: 10px 15px; border-radius: 12px; font-size: 14px; color: #000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
        .my-msg .msg-content { background: #dcf8c6; } .other-msg .msg-content { background: #ffffff; }

        .reply-preview { background: #eee; padding: 10px; border-left: 5px solid #00a884; display: none; justify-content: space-between; color: #333; }
        
        /* Sticky Input Area */
        .input-area { background: rgba(0,0,0,0.08); padding: 15px; border-top: 1px solid rgba(0,0,0,0.1); }
        .input-row { display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid rgba(0,0,0,0.1); outline: none; background: rgba(255,255,255,0.7); }
        .bg-picker { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid white; }

        .room-form { padding: 15px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
        .room-form input { background: #202c33; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; outline: none; }
    </style>
</head>
<body>

    <audio id="msg-sound" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3"></audio>

    <div id="sidebar">
        <div class="sidebar-header">San Chat Rooms <span onclick="document.body.classList.toggle('light-mode')" style="cursor:pointer; font-size:20px;">🌓</span></div>
        <div class="room-list" id="room-list"></div>
        <div class="room-form">
            <input type="text" id="new-room-id" placeholder="Room ID">
            <input type="text" id="new-room-name" placeholder="Friend's Name">
            <button onclick="createRoom()" style="background:#00a884; color:white; border:none; padding:10px; cursor:pointer; font-weight:bold; border-radius:8px;">Create Private Room</button>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container" id="main-chat">
            <header>
                <div class="header-left">
                    <div><span id="online-indicator"></span><b id="current-room-name" style="font-size:14px;">...</b></div>
                    <div id="typing-status" style="font-size:10px; color:#00ff00; height:12px;"></div>
                </div>
                <div style="text-align:center; font-weight:bold;">San Chat</div>
                <div class="header-right">
                    <span onclick="minimizeChat()">−</span>
                    <span onclick="popOut()">❐</span>
                    <span onclick="closeChat()">×</span>
                </div>
            </header>
            <div id="chat-box"></div>
            <div class="reply-preview" id="reply-area"><span id="reply-text"></span><span onclick="cancelReply()" style="cursor:pointer;">×</span></div>
            <div class="input-area">
                <div class="input-row">
                    <input type="color" class="bg-picker" id="bg-color" value="#efe7dd" oninput="document.getElementById('main-chat').style.backgroundColor = this.value">
                    <input type="text" id="msg-input" placeholder="Write something..." oninput="handleTyping()" onkeypress="if(event.key === 'Enter') sendMsg()">
                    <button onclick="sendMsg()" style="background:none; border:none; font-size:28px; cursor:pointer;">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyASJOEAvLPxkOXSV2lR9N0aLAYtXGZPZ98", authDomain: "sun-message.firebaseapp.com", projectId: "sun-message", appId: "1:156320327886:web:54f780dea6dbce43d0489f" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let myId = localStorage.getItem('userId') || 'u' + Date.now();
        localStorage.setItem('userId', myId);
        let currentRoomId = "", replyData = null, lastMsgCount = 0;

        // CRITICAL UPDATE: Remove Sidebar from DOM if room link
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const r = urlParams.get('room');
            if(r) {
                const side = document.getElementById('sidebar');
                if(side) side.remove(); // This completely deletes the sidebar for the friend
                openRoom(r, "Private Chat");
            }
        };

        function minimizeChat() {
            let c = document.getElementById('main-chat');
            c.style.height = (c.style.height === '350px') ? '600px' : '350px';
            c.style.width = (c.style.width === '350px') ? '420px' : '350px';
            const box = document.getElementById('chat-box');
            setTimeout(() => { box.scrollTop = box.scrollHeight; }, 200);
        }

        function createRoom() {
            const id = document.getElementById('new-room-id').value.trim();
            const name = document.getElementById('new-room-name').value.trim();
            if(id && name) db.collection("active_rooms").doc(id).set({ displayName: name, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        }

        db.collection("active_rooms").orderBy("createdAt", "desc").onSnapshot(snap => {
            const list = document.getElementById('room-list'); 
            if(!list) return; // Prevent error if sidebar is removed
            list.innerHTML = "";
            snap.forEach(doc => {
                const url = window.location.origin + window.location.pathname + "?room=" + doc.id;
                list.innerHTML += `<div class="room-item"><b onclick="openRoom('${doc.id}', '${doc.data().displayName}')" style="flex:1;">${doc.data().displayName}</b><div style="gap:10px; display:flex;"><span onclick="navigator.clipboard.writeText('${url}'); alert('Copied!')">🔗</span><span onclick="if(confirm('Delete?')) db.collection('active_rooms').doc('${doc.id}').delete()">🗑️</span></div></div>`;
            });
        });

        function openRoom(id, name) {
            currentRoomId = id; document.getElementById('main-chat').style.display = 'flex';
            document.getElementById('current-room-name').innerText = name;
            lastMsgCount = 0; loadMsgs();
            db.collection("chats").doc(currentRoomId).collection("typing").onSnapshot(snap => {
                let typ = false; snap.forEach(d => { if(d.id !== myId && d.data().isTyping) typ = true; });
                document.getElementById('typing-status').innerText = typ ? "Friend is typing..." : "";
            });
        }

        function sendMsg() {
            let t = document.getElementById('msg-input').value;
            if(t && currentRoomId) {
                db.collection("chats").doc(currentRoomId).collection("messages").add({ text: t, senderId: myId, replyTo: replyData, seen: false, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                document.getElementById('msg-input').value = ""; replyData = null; document.getElementById('reply-area').style.display='none';
            }
        }

        function loadMsgs() {
            db.collection("chats").doc(currentRoomId).collection("messages").orderBy("createdAt").onSnapshot(snap => {
                let box = document.getElementById('chat-box'); box.innerHTML = "";
                if (lastMsgCount > 0 && snap.size > lastMsgCount && snap.docs[snap.size-1].data().senderId !== myId) document.getElementById('msg-sound').play();
                lastMsgCount = snap.size;
                snap.forEach(doc => {
                    let d = doc.data(); let isMe = d.senderId === myId;
                    if (!isMe && d.seen === false) db.collection("chats").doc(currentRoomId).collection("messages").doc(doc.id).update({ seen: true });
                    let seenStatus = isMe ? (d.seen ? '<span style="color:#34b7f1">✓✓</span>' : '<span style="color:#888">✓✓</span>') : '';
                    box.innerHTML += `<div class="msg-wrapper ${isMe?'my-msg':'other-msg'}"><div class="msg-content" onclick="setReply('${d.text}')">${d.replyTo ? `<div style="font-size:10px; opacity:0.5; border-left:2px solid green; padding-left:5px;">${d.replyTo}</div>` : ''}${d.text}<div style="font-size:10px; text-align:right;">${seenStatus} ${isMe ? `<span onclick="db.collection('chats').doc(currentRoomId).collection('messages').doc('${doc.id}').delete()">🗑️</span>` : ''}</div></div></div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }
        function setReply(t) { replyData = t; document.getElementById('reply-area').style.display='flex'; document.getElementById('reply-text').innerText="Reply: "+t; }
        function cancelReply() { replyData = null; document.getElementById('reply-area').style.display='none'; }
        function handleTyping() { if(currentRoomId) { db.collection("chats").doc(currentRoomId).collection("typing").doc(myId).set({ isTyping: true }); setTimeout(() => db.collection("chats").doc(currentRoomId).collection("typing").doc(myId).set({ isTyping: false }), 2000); } }
        function closeChat() { document.getElementById('main-chat').style.display = 'none'; }
        function popOut() { window.open(window.location.origin + window.location.pathname + "?room=" + currentRoomId, 'ChatWin', 'width=420,height=600'); }
    </script>
</body>
</html>
