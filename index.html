<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sun Chat - Professional Chat</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { height: 100vh; margin: 0; background: #202c33; display: flex; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        /* Sidebar Design (Inspired by image_48eba3.png) */
        .sidebar { width: 300px; background: #111b21; border-right: 1px solid #374045; display: flex; flex-direction: column; }
        .sidebar-header { background: #202c33; padding: 15px; color: #aebac1; text-align: center; font-weight: bold; border-bottom: 1px solid #374045; }
        .room-list { flex: 1; overflow-y: auto; padding: 10px; }
        .room-item { padding: 12px; display: flex; align-items: center; cursor: pointer; border-radius: 8px; margin-bottom: 5px; color: #e9edef; transition: 0.2s; }
        .room-item:hover { background: #2a3942; }
        .room-item.active { background: #2a3942; border-left: 4px solid #00a884; }
        .room-icon { width: 45px; height: 45px; background: #6a7175; border-radius: 50%; margin-right: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }

        /* Main Chat Area */
        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        
        /* Chat Container (Inspired by image_47037f.png) */
        .chat-container { 
            width: 90%; max-width: 500px; height: 550px; background: #efe7dd; 
            display: none; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.5); 
            border-radius: 20px; overflow: hidden; animation: popup 0.3s ease-out;
        }
        @keyframes popup { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        /* Message Bubbles (Inspired by image_47037f.png) */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 75%; }
        .my-msg { align-self: flex-end; }
        .other-msg { align-self: flex-start; }
        .msg-content { padding: 10px 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .my-msg .msg-content { background: #dcf8c6; border-radius: 12px 0 12px 12px; }
        .other-msg .msg-content { background: white; border-radius: 0 12px 12px 12px; }
        .sender-name { font-size: 11px; font-weight: bold; color: #075e54; margin-bottom: 3px; }
        .time { font-size: 10px; color: #888; text-align: right; margin-top: 5px; }

        /* Input Area */
        .input-area { background: #f0f0f0; padding: 15px; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ccc; outline: none; }
        .send-btn { background: #075e54; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; font-size: 20px; }

        /* Login Screen */
        #login-screen { position: fixed; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 30px; border-radius: 15px; text-align: center; width: 320px; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
        .login-box button { background: #075e54; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="color: #075e54;">Sun Message</h2>
            <input type="text" id="user-name" placeholder="Enter Your Name">
            <button onclick="login()">Enter Chat</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">Chat Rooms</div>
        <div class="room-list" id="room-list">
            <div style="color: #6a7175; text-align: center; padding: 20px;">No rooms available. Create one!</div>
        </div>
        <div style="padding: 10px; border-top: 1px solid #374045;">
            <input type="text" id="new-room-id" placeholder="Room Name (e.g. Friends)" style="width: 100%; padding: 10px; border-radius: 5px; border: none; background: #2a3942; color: white;">
            <button onclick="createRoom()" style="width: 100%; margin-top: 5px; padding: 10px; background: #00a884; border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold;">+ Create Room</button>
        </div>
    </div>

    <div class="main-content">
        <div style="color: #6a7175; font-size: 18px;" id="no-chat-msg">Select a room from the sidebar to start.</div>
        
        <div class="chat-container" id="main-chat">
            <header id="chat-header">Sun Message</header>
            <div id="chat-box"></div>
            <div class="input-area">
                <input type="text" id="message-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMsg()">
                <button class="send-btn" onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

    <script>
        // Your Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyASJOEAvLPxkOXSV2lR9N0aLAYtXGZPZ98",
            authDomain: "sun-message.firebaseapp.com",
            projectId: "sun-message",
            storageBucket: "sun-message.firebasestorage.app",
            messagingSenderId: "156320327886",
            appId: "1:156320327886:web:54f780dea6dbce43d0489f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        let userName = localStorage.getItem('chatName') || "";
        let currentRoom = "";
        let myId = localStorage.getItem('userId') || 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('userId', myId);

        if (userName) document.getElementById('login-screen').style.display = 'none';

        function login() {
            userName = document.getElementById('user-name').value.trim();
            if (userName) {
                localStorage.setItem('chatName', userName);
                document.getElementById('login-screen').style.display = 'none';
            }
        }

        function createRoom() {
            const roomId = document.getElementById('new-room-id').value.trim();
            if (roomId) {
                db.collection("active_rooms").doc(roomId).set({ name: roomId, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                document.getElementById('new-room-id').value = "";
                switchRoom(roomId);
            }
        }

        // Real-time Room List Update
        db.collection("active_rooms").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            const roomList = document.getElementById('room-list');
            roomList.innerHTML = "";
            snapshot.forEach((doc) => {
                const div = document.createElement("div");
                div.className = `room-item ${currentRoom === doc.id ? 'active' : ''}`;
                div.onclick = () => switchRoom(doc.id);
                div.innerHTML = `
                    <div class="room-icon">${doc.id.charAt(0).toUpperCase()}</div>
                    <div class="room-name">${doc.id}</div>
                `;
                roomList.appendChild(div);
            });
        });

        function switchRoom(id) {
            currentRoom = id;
            document.getElementById('no-chat-msg').style.display = 'none';
            document.getElementById('main-chat').style.display = 'flex';
            document.getElementById('chat-header').innerText = "Room: " + id;
            loadMessages();
        }

        function sendMsg() {
            const msgInput = document.getElementById('message-input');
            const text = msgInput.value.trim();
            if (text !== "" && currentRoom) {
                db.collection("chats").doc(currentRoom).collection("messages").add({
                    text: text,
                    senderName: userName,
                    senderId: myId,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                msgInput.value = "";
            }
        }

        function loadMessages() {
            db.collection("chats").doc(currentRoom).collection("messages").orderBy("createdAt", "asc")
            .onSnapshot((snapshot) => {
                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isMe = data.senderId === myId;
                    const time = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "...";
                    const wrapper = document.createElement("div");
                    wrapper.className = `msg-wrapper ${isMe ? 'my-msg' : 'other-msg'}`;
                    wrapper.innerHTML = `
                        <div class="msg-content">
                            ${!isMe ? `<div class="sender-name">${data.senderName}</div>` : ''}
                            <div class="msg-text">${data.text}</div>
                            <div class="time">${time}</div>
                        </div>
                    `;
                    chatBox.appendChild(wrapper);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }
    </script>
</body>
</html>
