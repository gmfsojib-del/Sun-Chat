<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Message - Premium Chat</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #efe7dd; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg-container { display: flex; flex-direction: column; max-width: 80%; position: relative; }
        .msg { padding: 8px 12px; border-radius: 10px; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); font-size: 15px; position: relative; }
        .time { font-size: 10px; color: #888; margin-top: 4px; align-self: flex-end; }
        .delete-btn { color: #ff5252; font-size: 12px; cursor: pointer; margin-top: 2px; text-decoration: underline; display: none; }
        .msg-container:hover .delete-btn { display: block; }
        .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px 18px; border-radius: 25px; border: none; outline: none; font-size: 16px; }
        button { background: #075e54; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    </style>
</head>
<body>

    <header>Sun Message</header>
    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="message" placeholder="মেসেজ লিখুন..." onkeypress="if(event.key === 'Enter') sendMsg()">
        <button onclick="sendMsg()">➤</button>
    </div>

    <script>
        // আপনার কনফিগ
        const firebaseConfig = {
            apiKey: "AIzaSyASJOEAvLPxkOXSV2lR9N0aLAYtXGZPZ98",
            authDomain: "sun-message.firebaseapp.com",
            projectId: "sun-message",
            storageBucket: "sun-message.firebasestorage.app",
            messagingSenderId: "156320327886",
            appId: "1:156320327886:web:54f780dea6dbce43d0489f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function sendMsg() {
            const msgInput = document.getElementById('message');
            const text = msgInput.value.trim();
            if (text !== "") {
                db.collection("messages").add({
                    text: text,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => { msgInput.value = ""; });
            }
        }

        function deleteMsg(id) {
            if(confirm("মেসেজটি ডিলিট করতে চান?")) {
                db.collection("messages").doc(id).delete();
            }
        }

        db.collection("messages").orderBy("createdAt", "asc").onSnapshot((snapshot) => {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const id = doc.id;
                const time = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "...";
                
                const container = document.createElement("div");
                container.className = "msg-container";
                container.innerHTML = `
                    <div class="msg">${data.text}</div>
                    <div class="time">${time}</div>
                    <div class="delete-btn" onclick="deleteMsg('${id}')">মুছে ফেলুন</div>
                `;
                chatBox.appendChild(container);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
