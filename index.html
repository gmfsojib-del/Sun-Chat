<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Chat - Pro Master</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-body: #202c33; --bg-side: #111b21; --txt-main: #e9edef;
            --border: #374045; --chat-bg: #efe7dd; --msg-me: #dcf8c6; --msg-other: #ffffff;
        }
        .light-mode {
            --bg-body: #f0f2f5; --bg-side: #ffffff; --txt-main: #111b21;
            --border: #e9edef; --chat-bg: #e5ddd5; --msg-me: #d9fdd3; --msg-other: #ffffff;
        }

        * { box-sizing: border-box; transition: background 0.3s, color 0.3s; }
        body { margin: 0; background: var(--bg-body); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 300px; background: var(--bg-side); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; color: #aebac1; font-weight: bold; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .theme-btn { cursor: pointer; font-size: 20px; color: #00a884; }

        .search-container { padding: 10px; border-bottom: 1px solid var(--border); }
        .search-container input { width: 100%; padding: 8px 12px; background: var(--bg-body); border: none; border-radius: 8px; color: var(--txt-main); outline: none; }

        .room-list { flex: 1; overflow-y: auto; padding: 10px; }
        .room-item { padding: 12px; cursor: pointer; color: var(--txt-main); border-radius: 8px; margin-bottom: 8px; background: var(--bg-body); border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .room-info { display: flex; align-items: center; gap: 10px; }
        .online-dot { width: 10px; height: 10px; background: #00a884; border-radius: 50%; box-shadow: 0 0 5px #00a884; }
        .delete-room-btn { color: #ff5252; font-size: 18px; cursor: pointer; }

        /* Chat Window */
        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; }
        .chat-container { width: 420px; height: 550px; background: var(--chat-bg); display: none; flex-direction: column; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        header { background: #075e54; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        .controls span { cursor: pointer; margin-left: 12px; font-size: 18px; font-weight: bold; }

        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
        .my-msg { align-self: flex-end; }
        .other-msg { align-self: flex-start; }
        .msg-content { padding: 8px 12px; border-radius: 10px; font-size: 14px; position: relative; color: #000; }
        .my-msg .msg-content { background: var(--msg-me); }
        .other-msg .msg-content { background: var(--msg-other); }

        /* Ticks & Time */
        .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 4px; }
        .time-text { font-size: 10px; color: #667781; }
        .tick-mark { font-size: 12px; color: #53bdeb; font-weight: bold; }
        .del-msg-btn { color: #ea0038; cursor: pointer; font-size: 14px; margin-left: 5px; }

        .input-area { background: #f0f0f0; padding: 12px; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        .send-btn { background: #075e54; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }

        .room-form { padding: 15px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
        .room-form input { background: var(--bg-body); border: none; color: var(--txt-main); padding: 10px; border-radius: 5px; }
        .room-form button { background: #00a884; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <span>Sun Chat</span>
            <span class="theme-btn" onclick="toggleTheme()">🌓</span>
        </div>
        <div class="search-container"><input type="text" id="search-input" placeholder="Search..." oninput="filterRooms()"></div>
        <div class="room-list" id="room-list"></div>
        <div class="room-form">
            <input type="text" id="new-room-id" placeholder="ID">
            <input type="text" id="new-room-name" placeholder="Name">
            <button onclick="createRoom()">Create</button>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container" id="main-chat">
            <header>
                <div id="current-room-name" style="font-size: 13px;">...</div>
                <div style="font-weight: bold; font-size: 18px;">Sun Chat</div>
                <div class="controls"><span onclick="popOut()">❐</span><span onclick="minimizeChat()">−</span><span onclick="closeChat()">×</span></div>
            </header>
            <div id="chat-box"></div>
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMsg()">
                <button class="send-btn" onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyASJOEAvLPxkOXSV2lR9N0aLAYtXGZPZ98",
            authDomain: "sun-message.firebaseapp.com",
            projectId: "sun-message",
            storageBucket: "sun-message.firebasestorage.app",
            messagingSenderId: "156320327886",
            appId: "1:156320327886:web:54f780dea6dbce43d0489f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let myId = localStorage.getItem('userId') || 'u' + Date.now();
        localStorage.setItem('userId', myId);
        let currentRoomId = "";

        // থিম পরিবর্তন
        function toggleTheme() { document.body.classList.toggle('light-mode'); }

        function createRoom() {
            const id = document.getElementById('new-room-id').value.trim();
            const name = document.getElementById('new-room-name').value.trim();
            if(id && name) {
                db.collection("active_rooms").doc(id).set({ displayName: name, creatorId: myId, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                document.getElementById('new-room-id').value = ""; document.getElementById('new-room-name').value = "";
            }
        }

        function deleteRoom(roomId) { if(confirm("Delete room?")) db.collection("active_rooms").doc(roomId).delete(); }

        function filterRooms() {
            const searchText = document.getElementById('search-input').value.toLowerCase();
            const rooms = document.getElementsByClassName('room-item');
            Array.from(rooms).forEach(room => {
                const name = room.getAttribute('data-name').toLowerCase();
                room.style.display = name.includes(searchText) ? 'flex' : 'none';
            });
        }

        db.collection("active_rooms").orderBy("createdAt", "desc").onSnapshot(snap => {
            const list = document.getElementById('room-list'); list.innerHTML = "";
            snap.forEach(doc => {
                const data = doc.data();
                let div = document.createElement('div'); div.className = 'room-item';
                div.setAttribute('data-name', data.displayName || doc.id);
                div.innerHTML = `<div class="room-info" onclick="openRoom('${doc.id}', '${data.displayName}')"><div class="online-dot"></div><div style="display:flex;flex-direction:column;"><span style="font-weight:bold;">${data.displayName}</span><span style="font-size:11px;">ID: ${doc.id}</span></div></div><span class="delete-room-btn" onclick="deleteRoom('${doc.id}')">🗑️</span>`;
                list.appendChild(div);
            });
        });

        function openRoom(id, name) {
            currentRoomId = id; document.getElementById('main-chat').style.display = 'flex';
            document.getElementById('current-room-name').innerText = name; loadMsgs();
        }

        function closeChat() { document.getElementById('main-chat').style.display = 'none'; currentRoomId = ""; }
        function minimizeChat() { let c = document.getElementById('main-chat'); c.style.height = (c.offsetHeight > 50) ? '45px' : '550px'; }

        function sendMsg() {
            let t = document.getElementById('msg-input').value;
            if(t && currentRoomId) {
                db.collection("chats").doc(currentRoomId).collection("messages").add({
                    text: t, senderId: myId, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('msg-input').value = "";
            }
        }

        function deleteMsg(msgId) { if(confirm("Delete?")) db.collection("chats").doc(currentRoomId).collection("messages").doc(msgId).delete(); }

        function loadMsgs() {
            if(!currentRoomId) return;
            db.collection("chats").doc(currentRoomId).collection("messages").orderBy("createdAt").onSnapshot(snap => {
                let box = document.getElementById('chat-box'); box.innerHTML = "";
                snap.forEach(doc => {
                    let d = doc.data(); let isMe = d.senderId === myId;
                    let timeStr = d.createdAt ? d.createdAt.toDate().getHours() + ":" + (d.createdAt.toDate().getMinutes() < 10 ? '0' : '') + d.createdAt.toDate().getMinutes() : "...";
                    
                    let wrap = document.createElement('div'); wrap.className = `msg-wrapper ${isMe?'my-msg':'other-msg'}`;
                    wrap.innerHTML = `
                        <div class="msg-content">
                            <span>${d.text}</span>
                            <div class="msg-meta">
                                <span class="time-text">${timeStr}</span>
                                ${isMe ? `<span class="tick-mark">✓✓</span> <span class="del-msg-btn" onclick="deleteMsg('${doc.id}')">×</span>` : ''}
                            </div>
                        </div>`;
                    box.appendChild(wrap);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function popOut() { if (currentRoomId) window.open(window.location.href, 'ChatWin', 'width=420,height=550'); }
    </script>
</body>
</html>
