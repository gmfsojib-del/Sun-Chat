<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Chat - Pro Max V7</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-body: #0f171c; --bg-side: #111b21; --txt-main: #e9edef;
            --border: #374045; --chat-bg: #efe7dd;
        }
        .light-mode {
            --bg-body: #f0f2f5; --bg-side: #ffffff; --txt-main: #111b21;
            --border: #ddd; --chat-bg: #e5ddd5;
        }
        * { box-sizing: border-box; transition: all 0.3s ease; }
        body { margin: 0; background: var(--bg-body); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; overflow: hidden; color: var(--txt-main); }

        .sidebar { width: 300px; background: var(--bg-side); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; font-weight: bold; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .room-list { flex: 1; overflow-y: auto; padding: 10px; }
        .room-item { 
            padding: 12px; cursor: pointer; border-radius: 8px; 
            margin-bottom: 8px; background: #202c33; border: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; color: #e9edef;
        }
        .room-item:hover { transform: scale(1.02); background: #2a3942; }

        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        .chat-container { width: 420px; height: 600px; background: var(--chat-bg); display: none; flex-direction: column; border-radius: 15px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }

        header { background: rgba(0,0,0,0.15); color: white; padding: 15px; display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; }
        .header-right { text-align: right; display: flex; gap: 12px; justify-content: flex-end; font-size: 18px; cursor: pointer; }
        .online-dot { width: 10px; height: 10px; background: #00ff00; border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 5px #00ff00; }

        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: transparent; scroll-behavior: smooth; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; position: relative; }
        .my-msg { align-self: flex-end; } .other-msg { align-self: flex-start; }
        .msg-content { padding: 10px 15px; border-radius: 12px; font-size: 14px; color: #000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; position: relative; }
        .my-msg .msg-content { background: #dcf8c6; } .other-msg .msg-content { background: #ffffff; }

        .reply-box { font-size: 11px; background: rgba(0,0,0,0.05); border-left: 3px solid #00a884; padding: 5px; margin-bottom: 5px; border-radius: 4px; color: #555; }
        .reply-preview { background: #eee; padding: 10px; border-left: 5px solid #00a884; display: none; justify-content: space-between; color: #333; align-items: center; }
        .reaction-badge { position: absolute; bottom: -8px; right: 8px; background: white; border-radius: 10px; padding: 1px 4px; font-size: 12px; }
        .del-btn { color: red; margin-left: 8px; display: none; font-size: 12px; cursor: pointer; }
        .my-msg:hover .del-btn { display: inline; }

        .input-area { background: rgba(0,0,0,0.05); padding: 15px; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid rgba(0,0,0,0.1); outline: none; background: rgba(255,255,255,0.7); }
        .bg-picker { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid white; }

        .room-form { padding: 15px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
        .room-form input { background: #202c33; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; outline: none; }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            San Chat Rooms 
            <span onclick="document.body.classList.toggle('light-mode')" style="cursor:pointer; font-size:20px;">🌓</span>
        </div>
        <div class="room-list" id="room-list"></div>
        <div class="room-form">
            <input type="text" id="new-room-id" placeholder="Room ID (e.g. funny-chat)">
            <input type="text" id="new-room-name" placeholder="Friend's Name">
            <button onclick="createRoom()" style="background:#00a884; color:white; border:none; padding:10px; cursor:pointer; font-weight:bold; border-radius:8px;">Create Private Room</button>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container" id="main-chat">
            <header>
                <div class="header-left">
                    <div style="display:flex; align-items:center;">
                        <span id="online-indicator"></span>
                        <div id="current-room-name" style="font-weight:bold; font-size:14px;">...</div>
                    </div>
                    <div id="typing-status" style="font-size:10px; color:#00ff00; height:12px;"></div>
                </div>
                <div style="text-align:center; font-weight:bold;">San Chat</div>
                <div class="header-right">
                    <span onclick="minimizeChat()">−</span>
                    <span onclick="popOut()">❐</span>
                    <span onclick="closeChat()" id="close-btn">×</span>
                </div>
            </header>
            
            <div id="chat-box"></div>
            
            <div class="reply-preview" id="reply-area">
                <span id="reply-text">Replying...</span>
                <span onclick="cancelReply()" style="cursor:pointer; font-weight:bold;">×</span>
            </div>

            <div class="input-area">
                <div class="input-row">
                    <input type="color" class="bg-picker" id="bg-color" value="#efe7dd" oninput="document.getElementById('main-chat').style.backgroundColor = this.value">
                    <input type="text" id="msg-input" placeholder="Write something..." oninput="handleTyping()" onkeypress="if(event.key === 'Enter') sendMsg()">
                    <button onclick="sendMsg()" style="background:none; border:none; font-size:28px; cursor:pointer;">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyASJOEAvLPxkOXSV2lR9N0aLAYtXGZPZ98", authDomain: "sun-message.firebaseapp.com", projectId: "sun-message", appId: "1:156320327886:web:54f780dea6dbce43d0489f" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let myId = localStorage.getItem('userId') || 'u' + Date.now();
        localStorage.setItem('userId', myId);
        let currentRoomId = "", replyData = null, typingTimeout;

        function updateStatus(s) { db.collection("users").doc(myId).set({ online: s }, { merge: true }); }
        updateStatus(true); window.onbeforeunload = () => updateStatus(false);

        function handleTyping() {
            if(!currentRoomId) return;
            db.collection("chats").doc(currentRoomId).collection("typing").doc(myId).set({ isTyping: true });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { db.collection("chats").doc(currentRoomId).collection("typing").doc(myId).set({ isTyping: false }); }, 2000);
        }

        window.onload = () => {
            const r = new URLSearchParams(window.location.search).get('room');
            if(r) { document.getElementById('sidebar').style.display='none'; openRoom(r, "Private Chat"); }
        };

        function createRoom() {
            const id = document.getElementById('new-room-id').value.trim();
            const name = document.getElementById('new-room-name').value.trim();
            if(id && name) {
                db.collection("active_rooms").doc(id).set({ displayName: name, createdAt: firebase.firestore.FieldValue.serverTimestamp() }).then(() => {
                    const link = window.location.origin + window.location.pathname + "?room=" + id;
                    const copy = confirm("Room created!\n\nLink: " + link + "\n\nCopy to clipboard?");
                    if(copy) navigator.clipboard.writeText(link).then(() => alert("Copied!"));
                });
            }
        }

        db.collection("active_rooms").orderBy("createdAt", "desc").onSnapshot(snap => {
            const list = document.getElementById('room-list'); list.innerHTML = "";
            snap.forEach(doc => {
                const url = window.location.origin + window.location.pathname + "?room=" + doc.id;
                list.innerHTML += `<div class="room-item"><b onclick="openRoom('${doc.id}', '${doc.data().displayName}')" style="flex:1;">${doc.data().displayName}</b><div style="display:flex; gap:10px;"><span onclick="navigator.clipboard.writeText('${url}'); alert('Copied!')">🔗</span><span onclick="if(confirm('Delete?')) db.collection('active_rooms').doc('${doc.id}').delete()">🗑️</span></div></div>`;
            });
        });

        function openRoom(id, name) {
            currentRoomId = id; document.getElementById('main-chat').style.display = 'flex';
            document.getElementById('current-room-name').innerText = name;
            loadMsgs();
            db.collection("users").onSnapshot(snap => {
                let on = false; snap.forEach(d => { if(d.id !== myId && d.data().online) on = true; });
                document.getElementById('online-indicator').className = on ? "online-dot" : "";
            });
            db.collection("chats").doc(currentRoomId).collection("typing").onSnapshot(snap => {
                let typ = false; snap.forEach(d => { if(d.id !== myId && d.data().isTyping) typ = true; });
                document.getElementById('typing-status').innerText = typ ? "Friend is typing..." : "";
            });
        }

        function sendMsg() {
            let t = document.getElementById('msg-input').value;
            if(t && currentRoomId) {
                db.collection("chats").doc(currentRoomId).collection("messages").add({ text: t, senderId: myId, reaction: "", replyTo: replyData, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                document.getElementById('msg-input').value = ""; cancelReply();
            }
        }

        function loadMsgs() {
            db.collection("chats").doc(currentRoomId).collection("messages").orderBy("createdAt").onSnapshot(snap => {
                let box = document.getElementById('chat-box'); box.innerHTML = "";
                snap.forEach(doc => {
                    let d = doc.data(); let isMe = d.senderId === myId;
                    let time = d.createdAt ? new Date(d.createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "";
                    box.innerHTML += `
                        <div class="msg-wrapper ${isMe?'my-msg':'other-msg'}">
                            <div class="msg-content" ondblclick="handleReaction('${doc.id}', '${d.reaction}')" onclick="setReply('${d.text}')">
                                ${d.replyTo ? `<div class="reply-box">${d.replyTo}</div>` : ''}
                                ${d.text}
                                ${d.reaction ? `<span class="reaction-badge">${d.reaction}</span>` : ''}
                                <div style="font-size:10px; opacity:0.6; text-align:right; color:#000; margin-top:4px;">${time} ✓✓ ${isMe ? `<span class="del-btn" onclick="event.stopPropagation(); if(confirm('Delete for everyone?')) db.collection('chats').doc(currentRoomId).collection('messages').doc('${doc.id}').delete()">🗑️</span>` : ''}</div>
                            </div>
                        </div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function setReply(t) { replyData = t.substring(0,40); document.getElementById('reply-area').style.display='flex'; document.getElementById('reply-text').innerText="Reply: "+replyData; }
        function cancelReply() { replyData = null; document.getElementById('reply-area').style.display='none'; }
        function handleReaction(id, r) { const e = prompt("Emoji:", r || ""); db.collection("chats").doc(currentRoomId).collection("messages").doc(id).update({ reaction: e || "" }); }
        function closeChat() { document.getElementById('main-chat').style.display = 'none'; }
        function minimizeChat() { let c = document.getElementById('main-chat'); c.style.height = c.offsetHeight > 100 ? '60px' : '600px'; }
        function popOut() { window.open(window.location.origin + window.location.pathname + "?room=" + currentRoomId, 'ChatWin', 'width=420,height=600'); }
    </script>
</body>
</html>
