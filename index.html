<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Chat - Master Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #202c33; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; overflow: hidden; }

        /* Sidebar Style */
        .sidebar { width: 300px; background: #111b21; border-right: 1px solid #374045; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; color: #aebac1; font-weight: bold; border-bottom: 1px solid #374045; }
        
        /* Search Bar Style */
        .search-container { padding: 10px; border-bottom: 1px solid #374045; }
        .search-container input { width: 100%; padding: 8px 12px; background: #202c33; border: none; border-radius: 8px; color: white; outline: none; font-size: 14px; }

        .room-list { flex: 1; overflow-y: auto; padding: 10px; }
        
        .room-item { 
            padding: 12px; cursor: pointer; color: #e9edef; border-radius: 8px; 
            margin-bottom: 8px; background: #202c33; border: 1px solid #374045; 
            display: flex; justify-content: space-between; align-items: center;
        }
        .room-item:hover { background: #2a3942; }
        .room-info { flex: 1; display: flex; align-items: center; gap: 10px; }
        
        /* Online Indicator Style */
        .online-dot { width: 10px; height: 10px; background: #00a884; border-radius: 50%; box-shadow: 0 0 5px #00a884; }
        
        .room-details { display: flex; flex-direction: column; }
        .room-name-text { font-weight: bold; font-size: 14px; }
        .room-id-text { font-size: 11px; color: #8696a0; }
        .delete-room-btn { color: #ff5252; font-size: 18px; cursor: pointer; padding: 5px; }

        /* Chat Container Style */
        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; }
        .chat-container { width: 420px; height: 550px; background: #efe7dd; display: none; flex-direction: column; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }

        header { background: #075e54; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        .controls span { cursor: pointer; margin-left: 12px; font-size: 18px; font-weight: bold; }

        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        
        /* Message & Time Stamp Style */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
        .my-msg { align-self: flex-end; }
        .other-msg { align-self: flex-start; }
        .msg-content { padding: 8px 12px; border-radius: 10px; font-size: 14px; position: relative; display: flex; flex-direction: column; }
        .my-msg .msg-content { background: #dcf8c6; }
        .other-msg .msg-content { background: white; }
        
        .msg-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .time-text { font-size: 9px; color: #8696a0; margin-top: 4px; align-self: flex-end; }
        .del-msg-btn { color: #ea0038; cursor: pointer; font-size: 12px; font-weight: bold; }

        .input-area { background: #f0f0f0; padding: 12px; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        .send-btn { background: #075e54; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }

        .room-form { padding: 15px; border-top: 1px solid #374045; display: flex; flex-direction: column; gap: 8px; }
        .room-form input { background: #2a3942; border: none; color: white; padding: 10px; border-radius: 5px; }
        .room-form button { background: #00a884; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">Sun Chat Rooms</div>
        
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search room name..." oninput="filterRooms()">
        </div>

        <div class="room-list" id="room-list"></div>
        
        <div class="room-form">
            <input type="text" id="new-room-id" placeholder="Room ID">
            <input type="text" id="new-room-name" placeholder="Friend's Name">
            <button onclick="createRoom()">Create Room</button>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container" id="main-chat">
            <header>
                <div id="current-room-name" style="font-size: 13px;">Select</div>
                <div style="font-weight: bold; font-size: 18px;">Sun Chat</div>
                <div class="controls">
                    <span title="Pop-out" onclick="popOut()">❐</span>
                    <span title="Minimize" onclick="minimizeChat()">−</span>
                    <span title="Close" onclick="closeChat()">×</span>
                </div>
            </header>
            <div id="chat-box"></div>
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMsg()">
                <button class="send-btn" onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyASJOEAvLPxkOXSV2lR9N0aLAYtXGZPZ98",
            authDomain: "sun-message.firebaseapp.com",
            projectId: "sun-message",
            storageBucket: "sun-message.firebasestorage.app",
            messagingSenderId: "156320327886",
            appId: "1:156320327886:web:54f780dea6dbce43d0489f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let myId = localStorage.getItem('userId') || 'u' + Date.now();
        localStorage.setItem('userId', myId);
        let currentRoomId = "";

        // রুম তৈরি করা
        function createRoom() {
            const id = document.getElementById('new-room-id').value.trim();
            const name = document.getElementById('new-room-name').value.trim();
            if(id && name) {
                db.collection("active_rooms").doc(id).set({
                    displayName: name,
                    creatorId: myId,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('new-room-id').value = "";
                document.getElementById('new-room-name').value = "";
            }
        }

        // রুম ডিলিট করা
        function deleteRoom(roomId) {
            if(confirm("Delete this entire room?")) {
                db.collection("active_rooms").doc(roomId).delete().then(() => {
                    if (currentRoomId === roomId) closeChat();
                });
            }
        }

        // সার্চ ফাংশন
        function filterRooms() {
            const searchText = document.getElementById('search-input').value.toLowerCase();
            const rooms = document.getElementsByClassName('room-item');
            Array.from(rooms).forEach(room => {
                const name = room.getAttribute('data-name').toLowerCase();
                room.style.display = name.includes(searchText) ? 'flex' : 'none';
            });
        }

        // রুম লিস্ট লোড করা
        db.collection("active_rooms").orderBy("createdAt", "desc").onSnapshot(snap => {
            const list = document.getElementById('room-list'); list.innerHTML = "";
            snap.forEach(doc => {
                const data = doc.data();
                let div = document.createElement('div'); 
                div.className = 'room-item';
                div.setAttribute('data-name', data.displayName || doc.id);
                div.innerHTML = `
                    <div class="room-info" onclick="openRoom('${doc.id}', '${data.displayName || doc.id}')">
                        <div class="online-dot"></div>
                        <div class="room-details">
                            <span class="room-name-text">${data.displayName || doc.id}</span>
                            <span class="room-id-text">ID: ${doc.id}</span>
                        </div>
                    </div>
                    <span class="delete-room-btn" onclick="deleteRoom('${doc.id}')">🗑️</span>
                `;
                list.appendChild(div);
            });
            filterRooms();
        });

        // চ্যাট খোলা
        function openRoom(id, name) {
            currentRoomId = id;
            document.getElementById('main-chat').style.display = 'flex';
            document.getElementById('current-room-name').innerText = name;
            loadMsgs();
        }

        function closeChat() { document.getElementById('main-chat').style.display = 'none'; currentRoomId = ""; }
        
        function minimizeChat() { 
            let c = document.getElementById('main-chat');
            c.style.height = (c.offsetHeight > 50) ? '45px' : '550px';
        }

        // মেসেজ পাঠানো
        function sendMsg() {
            let t = document.getElementById('msg-input').value;
            if(t && currentRoomId) {
                db.collection("chats").doc(currentRoomId).collection("messages").add({
                    text: t, senderId: myId, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('msg-input').value = "";
            }
        }

        // মেসেজ ডিলিট
        function deleteMsg(msgId) {
            if(confirm("Delete message?")) db.collection("chats").doc(currentRoomId).collection("messages").doc(msgId).delete();
        }

        // মেসেজ লোড (টাইম সহ)
        function loadMsgs() {
            if(!currentRoomId) return;
            db.collection("chats").doc(currentRoomId).collection("messages").orderBy("createdAt").onSnapshot(snap => {
                let box = document.getElementById('chat-box'); box.innerHTML = "";
                snap.forEach(doc => {
                    let d = doc.data(); let isMe = d.senderId === myId;
                    let timeStr = "";
                    if(d.createdAt) {
                        const date = d.createdAt.toDate();
                        timeStr = date.getHours() + ":" + (date.getMinutes() < 10 ? '0' : '') + date.getMinutes();
                    }

                    let wrap = document.createElement('div'); wrap.className = `msg-wrapper ${isMe?'my-msg':'other-msg'}`;
                    wrap.innerHTML = `
                        <div class="msg-content">
                            <div class="msg-header">
                                <span>${d.text}</span>
                                ${isMe ? `<span class="del-msg-btn" onclick="deleteMsg('${doc.id}')">×</span>` : ''}
                            </div>
                            <span class="time-text">${timeStr}</span>
                        </div>`;
                    box.appendChild(wrap);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function popOut() {
            if (currentRoomId) window.open(window.location.href, 'ChatWin', 'width=420,height=550');
        }
    </script>
</body>
</html>
