<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanChat - Pro Max V3</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-body: #0f171c; --bg-side: #111b21; --txt-main: #e9edef;
            --border: #374045; --chat-bg: #efe7dd;
        }
        * { box-sizing: border-box; transition: all 0.3s ease; }
        body { margin: 0; background: var(--bg-body); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; overflow: hidden; }

        .sidebar { width: 300px; background: var(--bg-side); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; color: #aebac1; font-weight: bold; border-bottom: 1px solid var(--border); }
        .room-list { flex: 1; overflow-y: auto; padding: 10px; }
        .room-item { 
            padding: 12px; cursor: pointer; color: var(--txt-main); border-radius: 8px; 
            margin-bottom: 8px; background: #202c33; border: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center;
        }
        .room-item:hover { transform: scale(1.02); background: #2a3942; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        .chat-container { 
            width: 420px; height: 600px; background: var(--chat-bg); display: none; 
            flex-direction: column; border-radius: 15px; overflow: hidden; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); animation: slideUp 0.5s ease-out;
        }

        header { 
            background: rgba(0,0,0,0.15); color: white; padding: 15px; 
            display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; 
        }
        .header-center { text-align: center; font-weight: bold; font-size: 20px; letter-spacing: 1px; }
        .header-right { text-align: right; display: flex; gap: 15px; justify-content: flex-end; font-size: 20px; cursor: pointer; }

        .online-dot { width: 10px; height: 10px; background: #00ff00; border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 5px #00ff00; }

        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: transparent; scroll-behavior: smooth; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; animation: slideUp 0.3s ease; position: relative; }
        .my-msg { align-self: flex-end; } .other-msg { align-self: flex-start; }
        .msg-content { padding: 10px 15px; border-radius: 12px; font-size: 14px; position: relative; color: #000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
        .my-msg .msg-content { background: #dcf8c6; border-bottom-right-radius: 2px; }
        .other-msg .msg-content { background: #ffffff; border-bottom-left-radius: 2px; }

        .reaction-badge { position: absolute; bottom: -10px; right: 10px; background: white; border-radius: 10px; padding: 2px 5px; font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 4px; font-size: 10px; opacity: 0.6; color: #000; }
        .del-btn { color: red; cursor: pointer; font-size: 12px; margin-left: 8px; opacity: 0; transition: 0.2s; }
        .my-msg:hover .del-btn { opacity: 1; }

        .input-area { background: rgba(0,0,0,0.05); padding: 15px; }
        .input-row { display: flex; gap: 12px; align-items: center; }
        input[type="text"] { 
            flex: 1; padding: 12px 18px; border-radius: 25px; 
            border: 1px solid rgba(0,0,0,0.1); outline: none; 
            background: rgba(255,255,255,0.7); font-size: 15px;
        }
        .bg-picker { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid white; background: #000; }

        .room-form { padding: 15px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
        .room-form input { background: #202c33; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">SanChat Rooms</div>
        <div class="room-list" id="room-list"></div>
        <div class="room-form">
            <input type="text" id="new-room-id" placeholder="Room ID (e.g. San-chat)">
            <input type="text" id="new-room-name" placeholder="Friend's Name">
            <button onclick="createRoom()" style="background:#00a884; color:white; border:none; padding:10px; cursor:pointer; font-weight:bold; border-radius:8px;">Create Private Room</button>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container" id="main-chat">
            <header id="chat-header">
                <div class="header-left">
                    <div style="display:flex; align-items:center;">
                        <span id="online-indicator"></span>
                        <div id="current-room-name" style="font-weight:bold;">...</div>
                    </div>
                    <div id="typing-status" style="font-size:10px; color:#ffd700;"></div>
                </div>
                <div class="header-center">SanChat</div>
                <div class="header-right">
                    <span onclick="minimizeChat()">−</span>
                    <span onclick="popOut()">❐</span>
                    <span onclick="closeChat()" id="close-btn">×</span>
                </div>
            </header>
            
            <div id="chat-box"></div>

            <div class="input-area">
                <div class="input-row">
                    <input type="color" class="bg-picker" id="bg-color" value="#efe7dd" oninput="changeTheme(this.value)">
                    <input type="text" id="msg-input" placeholder="Write something..." onkeypress="if(event.key === 'Enter') sendMsg()">
                    <button onclick="sendMsg()" style="background:none; border:none; font-size:28px; cursor:pointer;">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyASJOEAvLPxkOXSV2lR9N0aLAYtXGZPZ98",
            authDomain: "sun-message.firebaseapp.com",
            projectId: "sun-message",
            appId: "1:156320327886:web:54f780dea6dbce43d0489f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let myId = localStorage.getItem('userId') || 'u' + Date.now();
        localStorage.setItem('userId', myId);
        
        let currentRoomId = "";

        function updateStatus(status) {
            db.collection("users").doc(myId).set({ online: status, lastSeen: Date.now() }, { merge: true });
        }
        updateStatus(true);
        window.onbeforeunload = () => updateStatus(false);

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomIdFromUrl = urlParams.get('room');
            if (roomIdFromUrl) {
                document.getElementById('sidebar').style.display = 'none';
                document.getElementById('close-btn').style.display = 'none';
                openRoom(roomIdFromUrl, "Private Chat");
            }
        };

        function changeTheme(color) { 
            document.getElementById('main-chat').style.backgroundColor = color;
        }

        function createRoom() {
            const id = document.getElementById('new-room-id').value.trim();
            const name = document.getElementById('new-room-name').value.trim();
            if(id && name) {
                db.collection("active_rooms").doc(id).set({ 
                    displayName: name, creatorId: myId, createdAt: firebase.firestore.FieldValue.serverTimestamp() 
                }).then(() => {
                    const shareLink = window.location.origin + window.location.pathname + "?room=" + id;
                    const copySuccess = confirm("রুম তৈরি হয়েছে!\n\nলিঙ্ক: " + shareLink + "\n\nলিঙ্কটি কি কপি করতে চান?");
                    if (copySuccess) {
                        navigator.clipboard.writeText(shareLink).then(() => alert("লিঙ্ক কপি হয়েছে!"));
                    }
                });
            }
        }

        db.collection("active_rooms").orderBy("createdAt", "desc").onSnapshot(snap => {
            const list = document.getElementById('room-list'); list.innerHTML = "";
            snap.forEach(doc => {
                let d = doc.data();
                const roomUrl = window.location.origin + window.location.pathname + "?room=" + doc.id;
                let div = document.createElement('div'); div.className = 'room-item';
                div.innerHTML = `
                    <div onclick="openRoom('${doc.id}', '${d.displayName}')" style="flex:1;"><b>${d.displayName}</b></div>
                    <div style="display:flex; gap:10px;">
                        <span onclick="navigator.clipboard.writeText('${roomUrl}'); alert('লিঙ্ক কপি হয়েছে!');">🔗</span>
                        <span onclick="deleteRoom('${doc.id}')">🗑️</span>
                    </div>`;
                list.appendChild(div);
            });
        });

        function openRoom(id, name) {
            currentRoomId = id; 
            document.getElementById('main-chat').style.display = 'flex';
            document.getElementById('current-room-name').innerText = name;
            loadMsgs();
            listenToOnlineStatus();
        }

        function listenToOnlineStatus() {
            db.collection("users").onSnapshot(snap => {
                let someoneOnline = false;
                snap.forEach(doc => {
                    if(doc.id !== myId && doc.data().online) someoneOnline = true;
                });
                document.getElementById('online-indicator').className = someoneOnline ? "online-dot" : "";
            });
        }

        function sendMsg() {
            let t = document.getElementById('msg-input').value;
            if(t && currentRoomId) {
                db.collection("chats").doc(currentRoomId).collection("messages").add({
                    text: t, senderId: myId, reaction: "", createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('msg-input').value = "";
            }
        }

        function handleReaction(msgId, currentReaction) {
            let promptMsg = currentReaction ? "Reaction মুছতে চাইলে খালি রেখে OK দিন, অথবা নতুন ইমোজি দিন:" : "Emoji (❤️, 👍, 😂):";
            const r = prompt(promptMsg, currentReaction || "");
            db.collection("chats").doc(currentRoomId).collection("messages").doc(msgId).update({ reaction: r || "" });
        }

        function deleteMsgForEveryone(msgId) {
            if(confirm("Delete for everyone?")) {
                db.collection("chats").doc(currentRoomId).collection("messages").doc(msgId).delete();
            }
        }

        function loadMsgs() {
            db.collection("chats").doc(currentRoomId).collection("messages").orderBy("createdAt").onSnapshot(snap => {
                let box = document.getElementById('chat-box'); box.innerHTML = "";
                snap.forEach(doc => {
                    let d = doc.data(); let isMe = d.senderId === myId;
                    let time = d.createdAt ? new Date(d.createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "";
                    let wrap = document.createElement('div'); wrap.className = `msg-wrapper ${isMe?'my-msg':'other-msg'}`;
                    wrap.innerHTML = `
                        <div class="msg-content" ondblclick="handleReaction('${doc.id}', '${d.reaction || ''}')">
                            ${d.text}
                            ${d.reaction ? `<span class="reaction-badge">${d.reaction}</span>` : ''}
                            <div class="msg-meta">
                                ${time} ✓✓ ${isMe ? `<span class="del-btn" onclick="deleteMsgForEveryone('${doc.id}')">🗑️</span>` : ''}
                            </div>
                        </div>`;
                    box.appendChild(wrap);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function deleteRoom(id) { if(confirm("Delete?")) db.collection("active_rooms").doc(id).delete(); }
        function closeChat() { document.getElementById('main-chat').style.display = 'none'; }
        function minimizeChat() { 
            let c = document.getElementById('main-chat'); 
            c.style.height = (c.offsetHeight > 60) ? '55px' : '600px';
        }
        function popOut() { window.open(window.location.origin + window.location.pathname + "?room=" + currentRoomId, 'ChatWin', 'width=420,height=600'); }
    </script>
</body>
</html>
