<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GMS Colour Pantone</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; padding: 20px; display: flex; flex-direction: column; }
        #history-sidebar { width: 220px; background: #fff; height: 90vh; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: fixed; overflow-y: auto; }
        .wrapper { display: flex; justify-content: center; padding-left: 240px; }
        .main-card { width: 950px; display: flex; flex-direction: column; gap: 20px; }
        .solid-box { background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .controls { display: flex; justify-content: center; gap: 10px; align-items: center; flex-wrap: wrap; }
        input { width: 70px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; text-align: center; }
        input#hexInput { width: 140px; }
        button { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; }
        
        /* প্যালেট এরিয়া যেন শুধু কালার বক্স দেখায় */
        .capture-area { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 890px; margin: 0 auto; }
        .color-box { width: 100px; height: 95px; border-radius: 6px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; border: 1px solid #000; position: relative; cursor: pointer; }
        .rgb-label { background: white; width: 100%; font-size: 10px; font-weight: bold; text-align: center; border-top: 1px solid #000; }
        .copy-toast { position: absolute; top: 30%; background: rgba(0,0,0,0.7); color: #fff; padding: 2px 5px; border-radius: 3px; font-size: 10px; display: none; }
        .download-btn { display: flex; justify-content: center; margin-top: 15px; }
        .history-item { width: 100%; height: 50px; border-radius: 4px; margin-bottom: 10px; cursor: pointer; border: 1px solid #ddd; }
        .app-footer { text-align: center; padding: 20px; background: #2c3e50; color: #fff; margin-top: 20px; }
    </style>
</head>
<body>

<div id="history-sidebar"><h3>History</h3><div id="history-list"></div></div>

<div class="wrapper">
    <div class="main-card">
        <div class="solid-box">
            <h1>GMS Colour Pantone</h1>
            <div class="controls">
                <input type="text" id="hexInput" placeholder="Hex (#0078FF)">
                <input type="number" id="rInput" placeholder="R">
                <input type="number" id="gInput" placeholder="G">
                <input type="number" id="bInput" placeholder="B">
                <button onclick="handleGenerate()">Generate</button>
            </div>
        </div>
        <div id="all-boxes"></div>
    </div>
</div>

<footer class="app-footer"><h3>Developed & Styled with ❤️ by GM Sojib</h3></footer>

<script>
    let historyArray = JSON.parse(localStorage.getItem('colorHistory')) || [];
    const configs = [
        {id: 'light', title: 'Light Palette', mod: (c, f) => ({r: c.r+(255-c.r)*f, g: c.g+(255-c.g)*f, b: c.b+(255-c.b)*f})},
        {id: 'dark', title: 'Dark Palette', mod: (c, f) => ({r: c.r*(1-f), g: c.g*(1-f), b: c.b*(1-f)})},
        {id: 'sat5', title: '+5% Saturation', mod: (c, f) => ({r: c.r*1.05+(255-c.r)*f, g: c.g*1.05+(255-c.g)*f, b: c.b*1.05+(255-c.b)*f})},
        {id: 'sat10', title: '+10% Saturation', mod: (c, f) => ({r: c.r*1.1+(255-c.r)*f, g: c.g*1.1+(255-c.g)*f, b: c.b*1.1+(255-c.b)*f})},
        {id: 'black', title: '+10% Black', mod: (c, f) => ({r: Math.max(0, c.r-25)*(1-f), g: Math.max(0, c.g-25)*(1-f), b: Math.max(0, c.b-25)*(1-f)})},
        {id: 'yel', title: '+5% Yellow', mod: (c, f) => ({r: (c.r+15)*(1-f), g: (c.g+15)*(1-f), b: c.b*(1-f)})},
        {id: 'red', title: '+5% Red', mod: (c, f) => ({r: (c.r+15)*(1-f), g: c.g*(1-f), b: c.b*(1-f)})},
        {id: 'grn', title: '+5% Green', mod: (c, f) => ({r: c.r*(1-f), g: Math.min(255, c.g+15)*(1-f), b: c.b*(1-f)})},
        {id: 'mag', title: '+5% Magenta', mod: (c, f) => ({r: (c.r+15)*(1-f), g: c.g*(1-f), b: (c.b+15)*(1-f)})}
    ];

    window.onload = () => {
        configs.forEach(conf => {
            let box = document.createElement('div');
            box.className = 'solid-box'; box.id = 'box-' + conf.id;
            // শুধু প্যালেট কন্টেইনারটিকে আইডি দিচ্ছি ডাউনলোডের জন্য
            box.innerHTML = `<h3>${conf.title}</h3><div id="cont-${conf.id}" class="capture-area"></div><div class="download-btn"><button onclick="downloadArea('cont-${conf.id}')">Download</button></div>`;
            document.getElementById('all-boxes').appendChild(box);
        });
        renderHistory();
    };

    function rgbToHex(r, g, b) {
        return "#" + ((1 << 24) + (Math.round(r) << 16) + (Math.round(g) << 8) + Math.round(b)).toString(16).slice(1).toUpperCase();
    }

    function hexToRgb(hex) {
        hex = hex.replace('#', '');
        return {r: parseInt(hex.substring(0,2),16), g: parseInt(hex.substring(2,4),16), b: parseInt(hex.substring(4,6),16)};
    }

    function handleGenerate() {
        let hex = document.getElementById('hexInput').value;
        let r = parseInt(document.getElementById('rInput').value);
        let g = parseInt(document.getElementById('gInput').value);
        let b = parseInt(document.getElementById('bInput').value);
        
        let c;
        if (!isNaN(r) && !isNaN(g) && !isNaN(b)) {
            c = {r, g, b};
            hex = rgbToHex(r, g, b);
        } else if (hex) {
            c = hexToRgb(hex);
        } else return;
        
        process(c);
        if(!historyArray.includes(hex)) { historyArray.push(hex); localStorage.setItem('colorHistory', JSON.stringify(historyArray)); renderHistory(); }
    }

    function process(c) {
        configs.forEach(conf => {
            let cont = document.getElementById('cont-' + conf.id);
            cont.innerHTML = '';
            for(let i=0; i<40; i++) {
                let f = i/39;
                let col = conf.mod(c, f);
                let hexVal = rgbToHex(col.r, col.g, col.b);
                const box = document.createElement('div');
                box.className = 'color-box';
                box.style.backgroundColor = `rgb(${col.r}, ${col.g}, ${col.b})`;
                box.innerHTML = `<div class="copy-toast">Copied!</div><div class="rgb-label">${Math.round(col.r)}, ${Math.round(col.g)}, ${Math.round(col.b)}</div>`;
                box.ondblclick = () => {
                    navigator.clipboard.writeText(hexVal).then(() => {
                        box.querySelector('.copy-toast').style.display = 'block';
                        setTimeout(() => box.querySelector('.copy-toast').style.display = 'none', 1000);
                    });
                };
                cont.appendChild(box);
            }
        });
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        historyArray.forEach(hex => {
            let item = document.createElement('div');
            item.className = 'history-item'; item.style.backgroundColor = hex;
            item.onclick = () => process(hexToRgb(hex));
            list.prepend(item);
        });
    }

    function downloadArea(id) { 
        // বাটন বা অন্য কিছু ছাড়া শুধু প্যালেট কন্টেইনারটি ক্যাপচার করছি
        html2canvas(document.getElementById(id), {scale: 3}).then(canvas => { 
            const link = document.createElement('a'); 
            link.download = 'Palette.png'; 
            link.href = canvas.toDataURL('image/png', 1.0); 
            link.click(); 
        }); 
    }
</script>
</body>
</html>
