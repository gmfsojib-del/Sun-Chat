<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Chat - Pro Max V9</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-body: #0f171c; --bg-side: #111b21; --txt-main: #e9edef;
            --border: #374045; --chat-bg: #efe7dd;
        }
        .light-mode {
            --bg-body: #f0f2f5; --bg-side: #ffffff; --txt-main: #111b21;
            --border: #ddd; --chat-bg: #e5ddd5;
        }
        * { box-sizing: border-box; transition: all 0.3s ease; }
        body { margin: 0; background: var(--bg-body); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; overflow: hidden; color: var(--txt-main); }

        /* Sidebar remains same */
        .sidebar { width: 300px; background: var(--bg-side); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
        .sidebar-header { padding: 15px; font-weight: bold; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .room-list { flex: 1; overflow-y: auto; padding: 10px; }
        .room-item { padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 8px; background: #202c33; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; color: #e9edef; }
        
        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }

        /* Updated Chat Container for Sticky Input */
        .chat-container { 
            width: 420px; height: 600px; background: var(--chat-bg); 
            display: none; flex-direction: column; border-radius: 15px; 
            overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            position: relative;
        }

        /* Minimize Class */
        .chat-container.minimized {
            height: 300px !important; /* Half size but scrollable */
            width: 350px;
            position: fixed;
            bottom: 20px;
            right: 20px;
        }

        header { background: rgba(0,0,0,0.15); color: white; padding: 15px; display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; cursor: move; }
        .header-right { text-align: right; display: flex; gap: 12px; justify-content: flex-end; font-size: 18px; cursor: pointer; }
        .online-dot { width: 10px; height: 10px; background: #00ff00; border-radius: 50%; display: inline-block; margin-right: 5px; }

        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: transparent; }
        
        /* Message Styles */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; }
        .my-msg { align-self: flex-end; } .other-msg { align-self: flex-start; }
        .msg-content { padding: 10px 15px; border-radius: 12px; font-size: 14px; color: #000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .my-msg .msg-content { background: #dcf8c6; } .other-msg .msg-content { background: #ffffff; }

        .reply-preview { background: #eee; padding: 10px; border-left: 5px solid #00a884; display: none; justify-content: space-between; color: #333; }
        
        /* Fixed Input Area */
        .input-area { 
            background: #f0f0f0; 
            padding: 10px 15px; 
            border-top: 1px solid rgba(0,0,0,0.1);
            position: sticky;
            bottom: 0;
            width: 100%;
        }
        .input-row { display: flex; gap: 8px; align-items: center; }
        input[type="text"] { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        
        .room-form { padding: 15px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
        .room-form input { background: #202c33; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <audio id="msg-sound" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3"></audio>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">San Chat Rooms <span onclick="document.body.classList.toggle('light-mode')" style="cursor:pointer;">🌓</span></div>
        <div class="room-list" id="room-list"></div>
        <div class="room-form">
            <input type="text" id="new-room-id" placeholder="Room ID">
            <input type="text" id="new-room-name" placeholder="Friend's Name">
            <button onclick="createRoom()" style="background:#00a884; color:white; border:none; padding:10px; cursor:pointer; border-radius:8px;">Create Private Room</button>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container" id="main-chat">
            <header>
                <div><span id="online-indicator"></span><b id="current-room-name" style="font-size:12px;">...</b></div>
                <div style="text-align:center;">San Chat<br><small id="typing-status" style="color:#00ff00; font-size:9px;"></small></div>
                <div class="header-right">
                    <span onclick="minimizeChat()">−</span>
                    <span onclick="popOut()">❐</span>
                    <span onclick="closeChat()">×</span>
                </div>
            </header>
            
            <div id="chat-box"></div>
            
            <div class="reply-preview" id="reply-area"><span id="reply-text"></span><span onclick="cancelReply()" style="cursor:pointer;">×</span></div>

            <div class="input-area">
                <div class="input-row">
                    <input type="text" id="msg-input" placeholder="Type a message..." oninput="handleTyping()" onkeypress="if(event.key==='Enter') sendMsg()">
                    <button onclick="sendMsg()" style="background:none; border:none; font-size:20px; cursor:pointer;">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyASJOEAvLPxkOXSV2lR9N0aLAYtXGZPZ98", authDomain: "sun-message.firebaseapp.com", projectId: "sun-message", appId: "1:156320327886:web:54f780dea6dbce43d0489f" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let myId = localStorage.getItem('userId') || 'u' + Date.now();
        localStorage.setItem('userId', myId);
        let currentRoomId = "", replyData = null, typingTimeout, lastMsgCount = 0;

        // Minimize Logic: Toggle Class
        function minimizeChat() {
            const chat = document.getElementById('main-chat');
            chat.classList.toggle('minimized');
            // Auto scroll to bottom when resizing
            const box = document.getElementById('chat-box');
            setTimeout(() => { box.scrollTop = box.scrollHeight; }, 300);
        }

        function updateStatus(s) { db.collection("users").doc(myId).set({ online: s }, { merge: true }); }
        updateStatus(true); window.onbeforeunload = () => updateStatus(false);

        function handleTyping() {
            if(!currentRoomId) return;
            db.collection("chats").doc(currentRoomId).collection("typing").doc(myId).set({ isTyping: true });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { db.collection("chats").doc(currentRoomId).collection("typing").doc(myId).set({ isTyping: false }); }, 2000);
        }

        function createRoom() {
            const id = document.getElementById('new-room-id').value.trim();
            const name = document.getElementById('new-room-name').value.trim();
            if(id && name) {
                db.collection("active_rooms").doc(id).set({ displayName: name, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
            }
        }

        db.collection("active_rooms").orderBy("createdAt", "desc").onSnapshot(snap => {
            const list = document.getElementById('room-list'); list.innerHTML = "";
            snap.forEach(doc => {
                list.innerHTML += `<div class="room-item"><b onclick="openRoom('${doc.id}', '${doc.data().displayName}')" style="flex:1;">${doc.data().displayName}</b><span onclick="navigator.clipboard.writeText('${window.location.origin + window.location.pathname}?room=${doc.id}'); alert('Link Copied!')">🔗</span></div>`;
            });
        });

        function openRoom(id, name) {
            currentRoomId = id; document.getElementById('main-chat').style.display = 'flex';
            document.getElementById('current-room-name').innerText = name;
            loadMsgs();
            db.collection("chats").doc(currentRoomId).collection("typing").onSnapshot(snap => {
                let typ = false; snap.forEach(d => { if(d.id !== myId && d.data().isTyping) typ = true; });
                document.getElementById('typing-status').innerText = typ ? "Typing..." : "";
            });
        }

        function sendMsg() {
            let t = document.getElementById('msg-input').value;
            if(t && currentRoomId) {
                db.collection("chats").doc(currentRoomId).collection("messages").add({ 
                    text: t, senderId: myId, replyTo: replyData, seen: false, createdAt: firebase.firestore.FieldValue.serverTimestamp() 
                });
                document.getElementById('msg-input').value = ""; cancelReply();
            }
        }

        function loadMsgs() {
            db.collection("chats").doc(currentRoomId).collection("messages").orderBy("createdAt").onSnapshot(snap => {
                let box = document.getElementById('chat-box'); box.innerHTML = "";
                if (lastMsgCount > 0 && snap.size > lastMsgCount) {
                    if (snap.docs[snap.size-1].data().senderId !== myId) document.getElementById('msg-sound').play();
                }
                lastMsgCount = snap.size;
                snap.forEach(doc => {
                    let d = doc.data(); let isMe = d.senderId === myId;
                    if (!isMe && !d.seen) db.collection("chats").doc(currentRoomId).collection("messages").doc(doc.id).update({ seen: true });
                    let seenTick = isMe ? (d.seen ? '<span style="color:#34b7f1">✓✓</span>' : '✓✓') : '';
                    box.innerHTML += `<div class="msg-wrapper ${isMe?'my-msg':'other-msg'}">
                        <div class="msg-content" onclick="setReply('${d.text}')">
                            ${d.replyTo ? `<div style="font-size:10px; background:rgba(0,0,0,0.05); padding:3px;">${d.replyTo}</div>` : ''}
                            ${d.text} <br> <small style="font-size:9px; opacity:0.5;">${seenTick}</small>
                        </div>
                    </div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function setReply(t) { replyData = t; document.getElementById('reply-area').style.display='flex'; document.getElementById('reply-text').innerText="Replying: "+t; }
        function cancelReply() { replyData = null; document.getElementById('reply-area').style.display='none'; }
        function closeChat() { document.getElementById('main-chat').style.display = 'none'; }
        function popOut() { window.open(window.location.origin + window.location.pathname + "?room=" + currentRoomId, 'ChatWin', 'width=420,height=600'); }
    </script>
</body>
</html>
