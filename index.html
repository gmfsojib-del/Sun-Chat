<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Message - WhatsApp Style</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #efe7dd; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; position: sticky; top: 0; z-index: 100; }
        
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        
        /* মেসেজ বাবল ডিজাইন */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 75%; position: relative; margin-bottom: 5px; }
        
        /* নিজের মেসেজ ডানে (Greenish) */
        .my-msg { align-self: flex-end; }
        .my-msg .msg-content { background: #dcf8c6; border-radius: 10px 0px 10px 10px; padding: 8px 12px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        
        /* অন্যের মেসেজ বামে (White) */
        .other-msg { align-self: flex-start; }
        .other-msg .msg-content { background: white; border-radius: 0px 10px 10px 10px; padding: 8px 12px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }

        .msg-text { font-size: 15px; color: #000; word-wrap: break-word; }
        .msg-info { display: flex; justify-content: flex-end; align-items: center; gap: 5px; margin-top: 4px; }
        .time { font-size: 10px; color: #777; }
        .delete-btn { color: #e53935; font-size: 10px; cursor: pointer; text-decoration: none; font-weight: bold; }

        /* ইনপুট এরিয়া */
        .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 8px; align-items: center; position: sticky; bottom: 0; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; font-size: 15px; }
        button { background: #075e54; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <header>Sun Message</header>
    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="message" placeholder="মেসেজ লিখুন..." onkeypress="if(event.key === 'Enter') sendMsg()">
        <button onclick="sendMsg()">➤</button>
    </div>

    <script>
        // আপনার Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyASJOEAvLPxkOXSV2lR9N0aLAYtXGZPZ98",
            authDomain: "sun-message.firebaseapp.com",
            projectId: "sun-message",
            storageBucket: "sun-message.firebasestorage.app",
            messagingSenderId: "156320327886",
            appId: "1:156320327886:web:54f780dea6dbce43d0489f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ইউজার আইডি সিমুলেশন (ব্রাউজার অনুযায়ী আলাদা হবে)
        const myId = localStorage.getItem('userId') || 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('userId', myId);

        function sendMsg() {
            const msgInput = document.getElementById('message');
            const text = msgInput.value.trim();
            if (text !== "") {
                db.collection("messages").add({
                    text: text,
                    senderId: myId, // কে পাঠাচ্ছে তা চেনার জন্য
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => { msgInput.value = ""; });
            }
        }

        function deleteMsg(id) {
            if(confirm("মেসেজটি সবার জন্য মুছে ফেলবেন?")) {
                db.collection("messages").doc(id).delete();
            }
        }

        db.collection("messages").orderBy("createdAt", "asc").onSnapshot((snapshot) => {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const id = doc.id;
                const isMe = data.senderId === myId;
                const time = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "...";
                
                const wrapper = document.createElement("div");
                wrapper.className = `msg-wrapper ${isMe ? 'my-msg' : 'other-msg'}`;
                
                wrapper.innerHTML = `
                    <div class="msg-content">
                        <div class="msg-text">${data.text}</div>
                        <div class="msg-info">
                            <span class="time">${time}</span>
                            ${isMe ? `<span class="delete-btn" onclick="deleteMsg('${id}')">×</span>` : ''}
                        </div>
                    </div>
                `;
                chatBox.appendChild(wrapper);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
