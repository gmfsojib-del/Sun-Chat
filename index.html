<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Message - Live Chat</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #e5ddd5; margin: 0; display: flex; flex-direction: column; align-items: center; }
        #chat-box { width: 95%; max-width: 450px; height: 75vh; background: white; border: 1px solid #ccc; overflow-y: auto; padding: 15px; margin-top: 10px; border-radius: 10px; display: flex; flex-direction: column; }
        .msg { margin: 5px; padding: 10px; border-radius: 10px; max-width: 80%; word-wrap: break-word; background: #fff; border: 1px solid #ddd; align-self: flex-start; }
        .input-area { margin: 10px; display: flex; width: 95%; max-width: 450px; gap: 8px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ccc; outline: none; }
        button { padding: 10px 20px; background: #075e54; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
        h2 { background: #075e54; color: white; width: 100%; text-align: center; padding: 15px 0; margin: 0; font-size: 20px; }
    </style>
</head>
<body>

    <h2>Sun Message - Live Chat</h2>
    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="message" placeholder="মেসেজ লিখুন..." onkeypress="if(event.key === 'Enter') sendMsg()">
        <button onclick="sendMsg()">পাঠান</button>
    </div>

    <script>
        // আপনার সঠিক Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyASJOEAvLPxkOXSV2lR9N0aLAYtXGZPZ98",
            authDomain: "sun-message.firebaseapp.com",
            projectId: "sun-message",
            storageBucket: "sun-message.firebasestorage.app",
            messagingSenderId: "156320327886",
            appId: "1:156320327886:web:54f780dea6dbce43d0489f"
        };

        // Firebase Initialize
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // মেসেজ পাঠানোর ফাংশন
        function sendMsg() {
            const msgInput = document.getElementById('message');
            const text = msgInput.value.trim();

            if (text !== "") {
                db.collection("messages").add({
                    text: text,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    msgInput.value = ""; // মেসেজ পাঠানোর পর বক্স খালি হবে
                }).catch((error) => {
                    console.error("Error sending message: ", error);
                    alert("মেসেজ যায়নি! Firebase Rules চেক করুন।");
                });
            }
        }

        // রিয়েল-টাইমে মেসেজ দেখানোর ফাংশন
        db.collection("messages").orderBy("createdAt", "asc")
            .onSnapshot((snapshot) => {
                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML = ""; // আগের মেসেজ ক্লিয়ার করা
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const msgDiv = document.createElement("div");
                    msgDiv.classList.add("msg");
                    msgDiv.textContent = data.text;
                    chatBox.appendChild(msgDiv);
                });
                chatBox.scrollTop = chatBox.scrollHeight; // অটো স্ক্রল নিচে যাবে
            });
    </script>
</body>
</html>
