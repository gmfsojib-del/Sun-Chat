<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Message - Palette Style</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #d1d7db; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* চ্যাট প্যালেট বা মূল বক্স */
        .chat-container { width: 100%; max-width: 450px; height: 95vh; background: #efe7dd; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border-radius: 15px; overflow: hidden; border: 1px solid #ccc; }
        
        header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; }
        
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; position: relative; }
        .my-msg { align-self: flex-end; }
        .other-msg { align-self: flex-start; }
        
        .msg-content { padding: 8px 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; }
        .my-msg .msg-content { background: #dcf8c6; border-radius: 10px 0px 10px 10px; }
        .other-msg .msg-content { background: white; border-radius: 0px 10px 10px 10px; }

        .msg-text { font-size: 15px; color: #000; word-wrap: break-word; }
        .msg-info { display: flex; justify-content: flex-end; align-items: center; gap: 5px; margin-top: 4px; }
        .time { font-size: 10px; color: #777; }
        .delete-btn { color: #e53935; font-size: 14px; cursor: pointer; font-weight: bold; padding-left: 5px; text-decoration: none; }

        /* ইনপুট এরিয়া */
        .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 8px; align-items: center; border-top: 1px solid #ddd; }
        input[type="text"] { flex: 1; padding: 12px 15px; border-radius: 25px; border: 1px solid #ccc; outline: none; font-size: 15px; }
        button { background: #075e54; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    </style>
</head>
<body>

    <div class="chat-container">
        <header>Sun Message</header>
        <div id="chat-box"></div>

        <div class="input-area">
            <input type="text" id="message" placeholder="মেসেজ লিখুন..." onkeypress="if(event.key === 'Enter') sendMsg()">
            <button onclick="sendMsg()">➤</button>
        </div>
    </div>

    <script>
        // আপনার সঠিক ফায়ারবেস কনফিগ
        const firebaseConfig = {
            apiKey: "AIzaSyASJOEAvLPxkOXSV2lR9N0aLAYtXGZPZ98",
            authDomain: "sun-message.firebaseapp.com",
            projectId: "sun-message",
            storageBucket: "sun-message.firebasestorage.app",
            messagingSenderId: "156320327886",
            appId: "1:156320327886:web:54f780dea6dbce43d0489f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ইউজার আইডি তৈরি (ব্রাউজার অনুযায়ী আলাদা হবে)
        const myId = localStorage.getItem('userId') || 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('userId', myId);

        // মেসেজ পাঠানোর ফাংশন
        function sendMsg() {
            const msgInput = document.getElementById('message');
            const text = msgInput.value.trim();
            if (text !== "") {
                db.collection("messages").add({
                    text: text,
                    senderId: myId,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => { 
                    msgInput.value = ""; 
                });
            }
        }

        // মেসেজ ডিলিট করার ফাংশন
        function deleteMsg(id) {
            if(confirm("মেসেজটি ডিলিট করতে চান?")) {
                db.collection("messages").doc(id).delete();
            }
        }

        // রিয়েল-টাইম মেসেজ আপডেট
        db.collection("messages").orderBy("createdAt", "asc").onSnapshot((snapshot) => {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const id = doc.id;
                const isMe = data.senderId === myId;
                const time = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "...";
                
                const wrapper = document.createElement("div");
                wrapper.className = `msg-wrapper ${isMe ? 'my-msg' : 'other-msg'}`;
                wrapper.innerHTML = `
                    <div class="msg-content">
                        <div class="msg-text">${data.text}</div>
                        <div class="msg-info">
                            <span class="time">${time}</span>
                            ${isMe ? `<span class="delete-btn" onclick="deleteMsg('${id}')">×</span>` : ''}
                        </div>
                    </div>
                `;
                chatBox.appendChild(wrapper);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
