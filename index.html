<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Message - Floating Window</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        /* ব্যাকগ্রাউন্ড হবে একদম হালকা বা স্বচ্ছ যাতে অন্য কাজ দেখা যায় */
        body { margin: 0; background: transparent; font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }

        /* সাইডবার বা রুম লিস্ট বাম দিকে ছোট করে থাকবে */
        .sidebar { 
            position: fixed; left: 10px; top: 10px; width: 200px; height: 300px; 
            background: #111b21; border-radius: 10px; border: 1px solid #374045; 
            display: flex; flex-direction: column; z-index: 999; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .sidebar-header { padding: 10px; color: #aebac1; font-size: 14px; border-bottom: 1px solid #374045; }
        .room-list { flex: 1; overflow-y: auto; padding: 5px; }
        .room-item { padding: 8px; cursor: pointer; color: #e9edef; font-size: 13px; border-radius: 5px; }
        .room-item:hover { background: #2a3942; }

        /* মেইন চ্যাট পপ-আপ - যেটা আপনি এক পাশে রাখতে চান */
        .chat-container { 
            position: fixed; right: 20px; bottom: 20px; /* ডানদিকের নিচে থাকবে */
            width: 350px; height: 450px; background: #efe7dd; 
            display: none; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
            border-radius: 12px 12px 0 0; overflow: hidden; z-index: 1000;
            transition: height 0.3s ease;
        }

        /* হেডার বা উইন্ডো কন্ট্রোল */
        header { 
            background: #075e54; color: white; padding: 10px 15px; 
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .controls span { margin-left: 10px; font-weight: bold; cursor: pointer; }

        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
        .my-msg { align-self: flex-end; }
        .other-msg { align-self: flex-start; }
        .msg-content { padding: 8px 12px; border-radius: 10px; font-size: 14px; position: relative; }
        .my-msg .msg-content { background: #dcf8c6; }
        .other-msg .msg-content { background: white; }

        .del-btn { color: #ff5252; cursor: pointer; font-size: 12px; margin-left: 5px; }

        .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 5px; }
        input { flex: 1; padding: 8px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        button { background: #075e54; color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">Rooms</div>
        <div class="room-list" id="room-list"></div>
        <div style="padding: 5px; display: flex; gap: 2px;">
            <input type="text" id="new-room" placeholder="New" style="width: 70%; font-size: 12px;">
            <button onclick="createRoom()" style="width: 25px; height: 25px; font-size: 12px;">+</button>
        </div>
    </div>

    <div class="chat-container" id="main-chat">
        <header onclick="toggleMinimize()">
            <span id="chat-header">Chat Window</span>
            <div class="controls">
                <span>−</span>
                <span onclick="event.stopPropagation(); closeChat();">×</span>
            </div>
        </header>
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Type..." onkeypress="if(event.key === 'Enter') sendMsg()">
            <button onclick="sendMsg()">➤</button>
        </div>
    </div>

    <script>
        // আপনার সঠিক ফায়ারবেস কনফিগ
        const firebaseConfig = {
            apiKey: "AIzaSyASJOEAvLPxkOXSV2lR9N0aLAYtXGZPZ98",
            authDomain: "sun-message.firebaseapp.com",
            projectId: "sun-message",
            storageBucket: "sun-message.firebasestorage.app",
            messagingSenderId: "156320327886",
            appId: "1:156320327886:web:54f780dea6dbce43d0489f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let myId = localStorage.getItem('userId') || 'u' + Date.now();
        localStorage.setItem('userId', myId);
        let currentRoom = "";

        function createRoom() {
            let r = document.getElementById('new-room').value;
            if(r) db.collection("active_rooms").doc(r).set({createdAt: firebase.firestore.FieldValue.serverTimestamp()});
        }

        db.collection("active_rooms").onSnapshot(snap => {
            const list = document.getElementById('room-list'); list.innerHTML = "";
            snap.forEach(doc => {
                let div = document.createElement('div'); div.className = 'room-item';
                div.innerText = "# " + doc.id; div.onclick = () => openRoom(doc.id);
                list.appendChild(div);
            });
        });

        function openRoom(id) {
            currentRoom = id;
            document.getElementById('main-chat').style.display = 'flex';
            document.getElementById('main-chat').style.height = '450px';
            document.getElementById('chat-header').innerText = id;
            loadMsgs();
        }

        function closeChat() { document.getElementById('main-chat').style.display = 'none'; }
        
        function toggleMinimize() { 
            let c = document.getElementById('main-chat');
            c.style.height = c.style.height === '40px' ? '450px' : '40px';
        }

        function sendMsg() {
            let t = document.getElementById('msg-input').value;
            if(t && currentRoom) {
                db.collection("chats").doc(currentRoom).collection("messages").add({
                    text: t, senderId: myId, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('msg-input').value = "";
            }
        }

        function deleteMsg(msgId) {
            if(confirm("Delete message?")) db.collection("chats").doc(currentRoom).collection("messages").doc(msgId).delete();
        }

        function loadMsgs() {
            db.collection("chats").doc(currentRoom).collection("messages").orderBy("createdAt").onSnapshot(snap => {
                let box = document.getElementById('chat-box'); box.innerHTML = "";
                snap.forEach(doc => {
                    let d = doc.data(); let isMe = d.senderId === myId;
                    let wrap = document.createElement('div'); wrap.className = `msg-wrapper ${isMe?'my-msg':'other-msg'}`;
                    wrap.innerHTML = `<div class="msg-content">${d.text} ${isMe? `<span class="del-btn" onclick="deleteMsg('${doc.id}')">×</span>` : ''}</div>`;
                    box.appendChild(wrap);
                });
                box.scrollTop = box.scrollHeight;
            });
        }
    </script>
</body>
</html>
