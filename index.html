<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Chat - Pro Experience</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #202c33; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; }

        /* Sidebar */
        .sidebar { width: 260px; background: #111b21; border-right: 1px solid #374045; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; color: #aebac1; font-weight: bold; border-bottom: 1px solid #374045; text-align: center; }
        .room-list { flex: 1; overflow-y: auto; padding: 10px; }
        .room-item { padding: 12px; cursor: pointer; color: #e9edef; border-radius: 8px; margin-bottom: 8px; background: #202c33; border: 1px solid #374045; }
        .room-item:hover { background: #2a3942; }
        .room-name-display { font-weight: bold; display: block; }
        .room-id-display { font-size: 11px; color: #8696a0; }

        /* Main Content */
        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        
        .chat-container { 
            width: 420px; height: 550px; background: #efe7dd; 
            display: none; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
            border-radius: 12px; overflow: hidden;
        }

        /* Header with Sun Chat in Middle */
        header { 
            background: #075e54; color: white; padding: 10px 15px; 
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        }
        #room-title { font-size: 14px; opacity: 0.9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .main-title { font-weight: bold; font-size: 18px; text-align: center; }
        .controls { text-align: right; }
        .controls span { cursor: pointer; margin-left: 10px; font-size: 18px; font-weight: bold; }

        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
        .my-msg { align-self: flex-end; }
        .other-msg { align-self: flex-start; }
        .msg-content { padding: 8px 12px; border-radius: 10px; font-size: 14px; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .my-msg .msg-content { background: #dcf8c6; }
        .other-msg .msg-content { background: white; }

        .del-btn { color: #ea0038; cursor: pointer; font-size: 14px; margin-left: 8px; font-weight: bold; }

        .input-area { background: #f0f0f0; padding: 12px; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        .send-btn { background: #075e54; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 18px; }

        /* Room Creation Form */
        .room-form { padding: 15px; border-top: 1px solid #374045; display: flex; flex-direction: column; gap: 8px; }
        .room-form input { background: #2a3942; border: none; color: white; padding: 8px; border-radius: 5px; font-size: 13px; }
        .room-form button { background: #00a884; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">Rooms List</div>
        <div class="room-list" id="room-list"></div>
        
        <div class="room-form">
            <input type="text" id="new-room-id" placeholder="Room ID (Unique)">
            <input type="text" id="new-room-name" placeholder="Friend's Name">
            <button onclick="createRoom()">Create Room</button>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container" id="main-chat">
            <header>
                <div id="room-title">Select Chat</div>
                <div class="main-title">Sun Chat</div>
                <div class="controls">
                    <span title="Pop-out" onclick="popOut()">❐</span>
                    <span title="Minimize" onclick="minimizeChat()">−</span>
                    <span title="Close" onclick="closeChat()">×</span>
                </div>
            </header>
            <div id="chat-box"></div>
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMsg()">
                <button class="send-btn" onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyASJOEAvLPxkOXSV2lR9N0aLAYtXGZPZ98",
            authDomain: "sun-message.firebaseapp.com",
            projectId: "sun-message",
            storageBucket: "sun-message.firebasestorage.app",
            messagingSenderId: "156320327886",
            appId: "1:156320327886:web:54f780dea6dbce43d0489f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let myId = localStorage.getItem('userId') || 'u' + Date.now();
        localStorage.setItem('userId', myId);
        let currentRoomId = "";

        function popOut() {
            if (!currentRoomId) return;
            window.open(window.location.href, 'ChatWindow', 'width=420,height=550,menubar=no,toolbar=no,location=no');
        }

        function createRoom() {
            const id = document.getElementById('new-room-id').value.trim();
            const name = document.getElementById('new-room-name').value.trim();
            if(id && name) {
                db.collection("active_rooms").doc(id).set({
                    displayName: name,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('new-room-id').value = "";
                document.getElementById('new-room-name').value = "";
            } else {
                alert("Please fill both ID and Name!");
            }
        }

        db.collection("active_rooms").orderBy("createdAt", "desc").onSnapshot(snap => {
            const list = document.getElementById('room-list'); list.innerHTML = "";
            snap.forEach(doc => {
                const data = doc.data();
                let div = document.createElement('div'); div.className = 'room-item';
                div.onclick = () => openRoom(doc.id, data.displayName || doc.id);
                div.innerHTML = `
                    <span class="room-name-display">${data.displayName || doc.id}</span>
                    <span class="room-id-display">ID: ${doc.id}</span>
                `;
                list.appendChild(div);
            });
        });

        function openRoom(id, name) {
            currentRoomId = id;
            document.getElementById('main-chat').style.display = 'flex';
            document.getElementById('room-title').innerText = name;
            loadMsgs();
        }

        function closeChat() { document.getElementById('main-chat').style.display = 'none'; }
        
        function minimizeChat() { 
            let c = document.getElementById('main-chat');
            c.style.height = (c.offsetHeight > 50) ? '45px' : '550px';
        }

        function sendMsg() {
            let t = document.getElementById('msg-input').value;
            if(t && currentRoomId) {
                db.collection("chats").doc(currentRoomId).collection("messages").add({
                    text: t, senderId: myId, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('msg-input').value = "";
            }
        }

        function deleteMsg(msgId) {
            if(confirm("Delete this message?")) {
                db.collection("chats").doc(currentRoomId).collection("messages").doc(msgId).delete();
            }
        }

        function loadMsgs() {
            db.collection("chats").doc(currentRoomId).collection("messages").orderBy("createdAt").onSnapshot(snap => {
                let box = document.getElementById('chat-box'); box.innerHTML = "";
                snap.forEach(doc => {
                    let d = doc.data(); let isMe = d.senderId === myId;
                    let wrap = document.createElement('div'); wrap.className = `msg-wrapper ${isMe?'my-msg':'other-msg'}`;
                    wrap.innerHTML = `<div class="msg-content">${d.text} ${isMe? `<span class="del-btn" onclick="deleteMsg('${doc.id}')">×</span>` : ''}</div>`;
                    box.appendChild(wrap);
                });
                box.scrollTop = box.scrollHeight;
            });
        }
    </script>
</body>
</html>
