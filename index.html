<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Chat - Ultra Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-body: #202c33; --bg-side: #111b21; --txt-main: #e9edef;
            --border: #374045; --chat-bg: #efe7dd; --msg-me: #dcf8c6; --msg-other: #ffffff;
        }
        .light-mode {
            --bg-body: #f0f2f5; --bg-side: #ffffff; --txt-main: #111b21;
            --border: #e9edef; --chat-bg: #e5ddd5; --msg-me: #d9fdd3; --msg-other: #ffffff;
        }
        * { box-sizing: border-box; transition: background 0.3s; }
        body { margin: 0; background: var(--bg-body); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; overflow: hidden; }

        .sidebar { width: 300px; background: var(--bg-side); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; color: #aebac1; font-weight: bold; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .theme-btn { cursor: pointer; font-size: 18px; color: #00a884; }

        .room-list { flex: 1; overflow-y: auto; padding: 10px; }
        .room-item { padding: 12px; cursor: pointer; color: var(--txt-main); border-radius: 8px; margin-bottom: 8px; background: var(--bg-body); border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        
        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; }
        .chat-container { width: 420px; height: 580px; background: var(--chat-bg); background-size: cover; background-position: center; display: none; flex-direction: column; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        
        header { background: #075e54; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        #typing-status { font-size: 10px; color: #ffd700; display: block; height: 12px; }

        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        
        /* Reply Box Style */
        .reply-preview { background: rgba(0,0,0,0.1); padding: 5px 10px; border-left: 4px solid #075e54; margin-bottom: 5px; font-size: 12px; display: none; justify-content: space-between; }
        .replied-msg { font-size: 11px; font-style: italic; background: rgba(0,0,0,0.05); padding: 3px; border-radius: 4px; margin-bottom: 4px; border-left: 2px solid #075e54; }

        .msg-content { padding: 8px 12px; border-radius: 10px; font-size: 14px; position: relative; cursor: pointer; }
        .my-msg { align-self: flex-end; } .other-msg { align-self: flex-start; }
        .my-msg .msg-content { background: var(--msg-me); } .other-msg .msg-content { background: var(--msg-other); }

        .input-area { background: #f0f0f0; padding: 10px; display: flex; flex-direction: column; }
        .input-row { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        
        .room-form { padding: 15px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 5px; }
        .room-form input { background: var(--bg-body); border: none; color: var(--txt-main); padding: 8px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">Sun Chat <span class="theme-btn" onclick="toggleTheme()">🌓</span></div>
        <div style="padding:10px;"><input type="text" id="search-input" placeholder="Search..." oninput="filterRooms()" style="width:100%; padding:5px; border-radius:5px; border:none; background:#202c33; color:white;"></div>
        <div class="room-list" id="room-list"></div>
        <div class="room-form">
            <input type="text" id="new-room-id" placeholder="Room ID">
            <input type="text" id="new-room-name" placeholder="Friend's Name">
            <button onclick="createRoom()" style="background:#00a884; color:white; border:none; padding:8px; cursor:pointer; font-weight:bold;">Create</button>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container" id="main-chat">
            <header>
                <div>
                    <div id="current-room-name" style="font-weight:bold;">Name</div>
                    <div id="typing-status"></div>
                </div>
                <div style="font-size: 18px; cursor:pointer;" onclick="changeWallpaper()">🖼️</div>
                <div style="display:flex; gap:10px; font-weight:bold; cursor:pointer;">
                    <span onclick="popOut()">❐</span><span onclick="closeChat()">×</span>
                </div>
            </header>
            
            <div id="chat-box"></div>

            <div class="input-area">
                <div id="reply-box" class="reply-preview">
                    <span id="reply-text"></span>
                    <span onclick="cancelReply()" style="cursor:pointer;">×</span>
                </div>
                <div class="input-row">
                    <input type="text" id="msg-input" placeholder="Type a message..." oninput="handleTyping()" onkeypress="if(event.key === 'Enter') sendMsg()">
                    <button onclick="sendMsg()" style="background:none; border:none; font-size:24px; cursor:pointer;">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyASJOEAvLPxkOXSV2lR9N0aLAYtXGZPZ98",
            authDomain: "sun-message.firebaseapp.com",
            projectId: "sun-message",
            appId: "1:156320327886:web:54f780dea6dbce43d0489f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let myId = localStorage.getItem('userId') || 'u' + Date.now();
        localStorage.setItem('userId', myId);
        let currentRoomId = "", replyMsg = null, typingTimeout;

        // সাউন্ড ফাইল
        const sendSound = new Audio('https://www.soundjay.com/buttons/sounds/button-37.mp3');
        const receiveSound = new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3');

        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        
        function changeWallpaper() {
            let url = prompt("Enter Image URL for Wallpaper:");
            if(url) document.getElementById('main-chat').style.backgroundImage = `url('${url}')`;
        }

        function createRoom() {
            const id = document.getElementById('new-room-id').value.trim();
            const name = document.getElementById('new-room-name').value.trim();
            if(id && name) db.collection("active_rooms").doc(id).set({ displayName: name, creatorId: myId, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        }

        db.collection("active_rooms").orderBy("createdAt", "desc").onSnapshot(snap => {
            const list = document.getElementById('room-list'); list.innerHTML = "";
            snap.forEach(doc => {
                let d = doc.data();
                let div = document.createElement('div'); div.className = 'room-item';
                div.innerHTML = `<div onclick="openRoom('${doc.id}', '${d.displayName}')"><b>${d.displayName}</b><br><small>ID: ${doc.id}</small></div><span onclick="deleteRoom('${doc.id}')">🗑️</span>`;
                list.appendChild(div);
            });
        });

        function openRoom(id, name) {
            currentRoomId = id; document.getElementById('main-chat').style.display = 'flex';
            document.getElementById('current-room-name').innerText = name;
            loadMsgs(); listenTyping();
        }

        function handleTyping() {
            db.collection("typing").doc(currentRoomId).set({ [myId]: true });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { db.collection("typing").doc(currentRoomId).set({ [myId]: false }); }, 2000);
        }

        function listenTyping() {
            db.collection("typing").doc(currentRoomId).onSnapshot(doc => {
                let data = doc.data();
                let isTyping = false;
                for(let id in data) { if(id !== myId && data[id] === true) isTyping = true; }
                document.getElementById('typing-status').innerText = isTyping ? "Typing..." : "";
            });
        }

        function sendMsg() {
            let t = document.getElementById('msg-input').value;
            if(t && currentRoomId) {
                db.collection("chats").doc(currentRoomId).collection("messages").add({
                    text: t, senderId: myId, replyTo: replyMsg, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                sendSound.play(); document.getElementById('msg-input').value = ""; cancelReply();
            }
        }

        function loadMsgs() {
            db.collection("chats").doc(currentRoomId).collection("messages").orderBy("createdAt").onSnapshot(snap => {
                let box = document.getElementById('chat-box'); let lastCount = box.children.length;
                box.innerHTML = "";
                snap.forEach(doc => {
                    let d = doc.data(); let isMe = d.senderId === myId;
                    let div = document.createElement('div'); div.className = `msg-wrapper ${isMe?'my-msg':'other-msg'}`;
                    div.innerHTML = `<div class="msg-content" onclick="setReply('${d.text}')">
                        ${d.replyTo ? `<div class="replied-msg">${d.replyTo}</div>` : ''}
                        ${d.text} <small style="display:block; font-size:9px; text-align:right;">✓✓</small>
                    </div>`;
                    box.appendChild(div);
                });
                if(box.children.length > lastCount && lastCount !== 0) receiveSound.play();
                box.scrollTop = box.scrollHeight;
            });
        }

        function setReply(text) {
            replyMsg = text;
            document.getElementById('reply-box').style.display = 'flex';
            document.getElementById('reply-text').innerText = text;
        }
        function cancelReply() { replyMsg = null; document.getElementById('reply-box').style.display = 'none'; }
        function deleteRoom(id) { if(confirm("Delete room?")) db.collection("active_rooms").doc(id).delete(); }
        function closeChat() { document.getElementById('main-chat').style.display = 'none'; }
        function popOut() { window.open(window.location.href, 'ChatWin', 'width=420,height=580'); }
        function filterRooms() {
            let q = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.room-item').forEach(i => i.style.display = i.innerText.toLowerCase().includes(q) ? 'flex' : 'none');
        }
    </script>
</body>
</html>
