<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sun Message - Center Palette</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        /* পুরো পেজটিকে মাঝখানে আনার জন্য */
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #d1d7db; /* পেজের বাইরের রঙ */
            display: flex; 
            justify-content: center; /* আড়াআড়ি মাঝখানে */
            align-items: center; /* ওপর-নিচ মাঝখানে */
            font-family: 'Segoe UI', sans-serif;
        }

        /* চ্যাট বক্সটিকে ছোট এবং মাঝখানে রাখার কন্টেইনার */
        .chat-container { 
            width: 95%; 
            max-width: 400px; /* বক্সের চওড়া নির্ধারণ */
            height: 80vh; /* স্ক্রিনের ৮০% উচ্চতা, যাতে ওপর-নিচে খালি থাকে */
            background: #efe7dd; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.3); 
            border-radius: 20px; /* চারকোনা গোল করা */
            overflow: hidden;
            border: 1px solid #bbb;
        }

        header { 
            background: #075e54; 
            color: white; 
            padding: 15px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 18px;
        }

        #chat-box { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }

        /* মেসেজ বাবল ডিজাইন */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; }
        .my-msg { align-self: flex-end; }
        .other-msg { align-self: flex-start; }
        
        .msg-content { padding: 8px 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; }
        .my-msg .msg-content { background: #dcf8c6; border-radius: 12px 0px 12px 12px; }
        .other-msg .msg-content { background: white; border-radius: 0px 12px 12px 12px; }

        .msg-text { font-size: 15px; color: #000; word-wrap: break-word; }
        .msg-info { display: flex; justify-content: flex-end; align-items: center; gap: 5px; margin-top: 4px; }
        .time { font-size: 10px; color: #777; }
        .delete-btn { color: #e53935; font-size: 14px; cursor: pointer; font-weight: bold; }

        /* ইনপুট এরিয়া ডিজাইন */
        .input-area { 
            background: #f0f0f0; 
            padding: 10px; 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            border-top: 1px solid #ddd;
        }
        input[type="text"] { 
            flex: 1; 
            padding: 12px; 
            border-radius: 25px; 
            border: 1px solid #ccc; 
            outline: none; 
            font-size: 15px;
        }
        button { 
            background: #075e54; 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 45px; 
            height: 45px; 
            cursor: pointer; 
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <header>Sun Message</header>
        <div id="chat-box"></div>

        <div class="input-area">
            <input type="text" id="message" placeholder="মেসেজ লিখুন..." onkeypress="if(event.key === 'Enter') sendMsg()">
            <button onclick="sendMsg()">➤</button>
        </div>
    </div>

    <script>
        // আপনার সঠিক ফায়ারবেস কনফিগ
        const firebaseConfig = {
            apiKey: "AIzaSyASJOEAvLPxkOXSV2lR9N0aLAYtXGZPZ98",
            authDomain: "sun-message.firebaseapp.com",
            projectId: "sun-message",
            storageBucket: "sun-message.firebasestorage.app",
            messagingSenderId: "156320327886",
            appId: "1:156320327886:web:54f780dea6dbce43d0489f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const myId = localStorage.getItem('userId') || 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('userId', myId);

        function sendMsg() {
            const msgInput = document.getElementById('message');
            const text = msgInput.value.trim();
            if (text !== "") {
                db.collection("messages").add({
                    text: text,
                    senderId: myId,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => { msgInput.value = ""; });
            }
        }

        function deleteMsg(id) {
            if(confirm("ডিলিট করবেন?")) {
                db.collection("messages").doc(id).delete();
            }
        }

        db.collection("messages").orderBy("createdAt", "asc").onSnapshot((snapshot) => {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const id = doc.id;
                const isMe = data.senderId === myId;
                const time = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "...";
                
                const wrapper = document.createElement("div");
                wrapper.className = `msg-wrapper ${isMe ? 'my-msg' : 'other-msg'}`;
                wrapper.innerHTML = `
                    <div class="msg-content">
                        <div class="msg-text">${data.text}</div>
                        <div class="msg-info">
                            <span class="time">${time}</span>
                            ${isMe ? `<span class="delete-btn" onclick="deleteMsg('${id}')">×</span>` : ''}
                        </div>
                    </div>
                `;
                chatBox.appendChild(wrapper);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
