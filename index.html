<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Message - Multi Layer</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #202c33; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; }

        /* Sidebar */
        .sidebar { width: 250px; background: #111b21; border-right: 1px solid #374045; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; color: #aebac1; font-weight: bold; border-bottom: 1px solid #374045; }
        .room-list { flex: 1; overflow-y: auto; padding: 10px; }
        .room-item { padding: 10px; cursor: pointer; color: #e9edef; border-radius: 5px; margin-bottom: 5px; font-size: 14px; }
        .room-item:hover { background: #2a3942; }

        /* Main Chat Container */
        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        
        .chat-container { 
            width: 400px; height: 500px; background: #efe7dd; 
            display: none; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
            border-radius: 10px; overflow: hidden;
        }

        /* Window Controls */
        header { 
            background: #075e54; color: white; padding: 12px 15px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .controls span { cursor: pointer; margin-left: 12px; font-size: 18px; font-weight: bold; }

        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
        .my-msg { align-self: flex-end; }
        .other-msg { align-self: flex-start; }
        .msg-content { padding: 8px 12px; border-radius: 10px; font-size: 14px; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .my-msg .msg-content { background: #dcf8c6; }
        .other-msg .msg-content { background: white; }

        .del-btn { color: red; cursor: pointer; font-size: 14px; margin-left: 8px; }

        .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        .send-btn { background: #075e54; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">Rooms</div>
        <div class="room-list" id="room-list"></div>
        <div style="padding: 10px;"><input type="text" id="new-room" placeholder="New Room" style="width: 80%; padding: 5px;"><button onclick="createRoom()">+</button></div>
    </div>

    <div class="main-content">
        <div class="chat-container" id="main-chat">
            <header>
                <span id="chat-header">Sun Message</span>
                <div class="controls">
                    <span title="Open in New Window" onclick="popOut()">❐</span>
                    <span title="Minimize" onclick="minimizeChat()">−</span>
                    <span title="Close" onclick="closeChat()">×</span>
                </div>
            </header>
            <div id="chat-box"></div>
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMsg()">
                <button class="send-btn" onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyASJOEAvLPxkOXSV2lR9N0aLAYtXGZPZ98",
            authDomain: "sun-message.firebaseapp.com",
            projectId: "sun-message",
            storageBucket: "sun-message.firebasestorage.app",
            messagingSenderId: "156320327886",
            appId: "1:156320327886:web:54f780dea6dbce43d0489f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let myId = localStorage.getItem('userId') || 'u' + Date.now();
        localStorage.setItem('userId', myId);
        let currentRoom = "";

        // আলাদা উইন্ডোতে পপ-আউট করার ফাংশন
        function popOut() {
            if (!currentRoom) return alert("Select a room first!");
            const url = window.location.href;
            // এই কোডটি ব্রাউজারের আলাদা একটি ছোট পপ-আপ উইন্ডো খুলবে
            window.open(url, 'ChatWindow', 'width=400,height=550,menubar=no,toolbar=no,location=no,status=no,resizable=yes');
        }

        function createRoom() {
            let r = document.getElementById('new-room').value;
            if(r) db.collection("active_rooms").doc(r).set({createdAt: firebase.firestore.FieldValue.serverTimestamp()});
        }

        db.collection("active_rooms").onSnapshot(snap => {
            const list = document.getElementById('room-list'); list.innerHTML = "";
            snap.forEach(doc => {
                let div = document.createElement('div'); div.className = 'room-item';
                div.innerText = "# " + doc.id; div.onclick = () => openRoom(doc.id);
                list.appendChild(div);
            });
        });

        function openRoom(id) {
            currentRoom = id;
            document.getElementById('main-chat').style.display = 'flex';
            document.getElementById('chat-header').innerText = id;
            loadMsgs();
        }

        function closeChat() { document.getElementById('main-chat').style.display = 'none'; }
        function minimizeChat() { 
            let c = document.getElementById('main-chat');
            c.style.height = c.style.height === '45px' ? '500px' : '45px';
        }

        function sendMsg() {
            let t = document.getElementById('msg-input').value;
            if(t && currentRoom) {
                db.collection("chats").doc(currentRoom).collection("messages").add({
                    text: t, senderId: myId, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('msg-input').value = "";
            }
        }

        function deleteMsg(msgId) {
            if(confirm("Delete?")) db.collection("chats").doc(currentRoom).collection("messages").doc(msgId).delete();
        }

        function loadMsgs() {
            db.collection("chats").doc(currentRoom).collection("messages").orderBy("createdAt").onSnapshot(snap => {
                let box = document.getElementById('chat-box'); box.innerHTML = "";
                snap.forEach(doc => {
                    let d = doc.data(); let isMe = d.senderId === myId;
                    let wrap = document.createElement('div'); wrap.className = `msg-wrapper ${isMe?'my-msg':'other-msg'}`;
                    wrap.innerHTML = `<div class="msg-content">${d.text} ${isMe? `<span class="del-btn" onclick="deleteMsg('${doc.id}')">×</span>` : ''}</div>`;
                    box.appendChild(wrap);
                });
                box.scrollTop = box.scrollHeight;
            });
        }
    </script>
</body>
</html>
